<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#09090f">
<meta name="description" content="Imposter: Dead Air — A social-deduction game of silence and suspicion. 4–10 players. One imposter. Find them before it's too late.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Imposter: Dead Air</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ═══ DESIGN TOKENS ═══ */
:root {
  --bg: #09090f;
  --surface: #111119;
  --surface2: #1a1a24;
  --surface3: #22222e;
  --border: #2a2a38;
  --border-focus: #3d5afe;
  --text: #e8e6f0;
  --text-dim: #7a7890;
  --text-faint: #4a4860;

  --signal: #3d5afe;
  --signal-glow: #3d5afe44;
  --signal-bright: #6979f8;
  --danger: #ff3d57;
  --danger-glow: #ff3d5744;
  --danger-dim: #a82038;
  --success: #00e676;
  --success-dim: #00a854;
  --warn: #ffab00;

  --mono: 'JetBrains Mono', 'Courier New', monospace;
  --sans: 'Space Grotesk', system-ui, -apple-system, sans-serif;

  --safe-b: max(8px, env(safe-area-inset-bottom));
  --safe-t: max(8px, env(safe-area-inset-top));
  --radius: 8px;
  --radius-lg: 14px;

  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
}

/* ═══ RESET ═══ */
*, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; }
body {
  background-color: var(--bg);
  background-image: 
    radial-gradient(ellipse at 50% 0%, rgba(61,90,254,0.08) 0%, transparent 60%),
    linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
  background-size: 100% 100%, 36px 36px, 36px 36px;
  color: var(--text);
  font: 400 16px/1.5 var(--sans);
  overflow-x: hidden;
  overscroll-behavior: none;
  -webkit-overflow-scrolling: touch;
  -webkit-font-smoothing: antialiased;
}

/* ═══ ATMOSPHERE: Scanlines + subtle noise ═══ */
body::before {
  content: "";
  position: fixed; inset: 0;
  background: repeating-linear-gradient(
    0deg,
    transparent 0px,
    transparent 2px,
    rgba(255,255,255,0.012) 2px,
    rgba(255,255,255,0.012) 4px
  );
  pointer-events: none;
  z-index: 9999;
}
body::after {
  content: "";
  position: fixed; inset: 0;
  background: radial-gradient(ellipse at 50% 0%, rgba(61,90,254,0.06) 0%, transparent 60%);
  pointer-events: none;
  z-index: 0;
}

/* ═══ LAYOUT ═══ */
#app {
  position: relative; z-index: 1;
  max-width: 520px;
  margin: 0 auto;
  padding: calc(var(--safe-t) + 8px) 16px calc(76px + var(--safe-b));
  min-height: 100%;
}

/* ═══ TYPOGRAPHY ═══ */
h1, h2, h3 { font-family: var(--mono); font-weight: 700; margin: 0; line-height: 1.1; letter-spacing: -0.02em; text-transform: uppercase; }
h1 { font-size: clamp(28px, 8vw, 44px); }
h2 { font-size: clamp(18px, 4.5vw, 24px); }
h3 { font-size: clamp(14px, 3.5vw, 17px); }

.phase-label {
  display: inline-flex; align-items: center; gap: 8px;
  font: 500 11px/1 var(--mono);
  color: var(--signal);
  text-transform: uppercase;
  letter-spacing: 0.12em;
  padding: 6px 12px;
  background: rgba(61,90,254,0.08);
  border: 1px solid rgba(61,90,254,0.15);
  border-radius: 4px;
  margin-bottom: 12px;
}
.phase-label::before {
  content: "";
  width: 6px; height: 6px;
  background: var(--signal);
  border-radius: 50%;
  animation: pulse-dot 2s ease-in-out infinite;
}
@keyframes pulse-dot {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.4; transform: scale(0.7); }
}

.dim { color: var(--text-dim); }
.faint { color: var(--text-faint); }
.danger-text { color: var(--danger); }
.signal-text { color: var(--signal); }
.success-text { color: var(--success); }
.mono { font-family: var(--mono); }

/* ═══ INTERACTIVE ═══ */
button, input, select { font: inherit; color: inherit; }
button {
  cursor: pointer; border: 0;
  min-height: 48px;
  touch-action: manipulation;
  appearance: none; -webkit-appearance: none;
}
:focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }

/* Primary button */
.btn {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  width: 100%;
  background: var(--signal);
  color: #fff;
  font: 600 15px/1 var(--sans);
  letter-spacing: 0.02em;
  padding: 14px 20px;
  border-radius: var(--radius);
  border: 1px solid transparent;
  min-height: 52px;
  transition: all 0.15s var(--ease-out);
  position: relative;
  overflow: hidden;
}
.btn::after {
  content: "";
  position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(255,255,255,0.08) 0%, transparent 50%);
  pointer-events: none;
}
.btn:hover { background: var(--signal-bright); transform: translateY(-1px); box-shadow: 0 4px 20px var(--signal-glow); }
.btn:active { transform: translateY(1px); }
.btn[disabled] { opacity: 0.35; pointer-events: none; filter: grayscale(0.3); }

.btn.alt {
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--text);
}
.btn.alt:hover { background: var(--surface3); border-color: var(--text-faint); }

.btn.danger {
  background: var(--danger);
  color: #fff;
}
.btn.danger:hover { background: #ff5270; box-shadow: 0 4px 20px var(--danger-glow); }

.btn.success {
  background: var(--success-dim);
  color: #fff;
}
.btn.success:hover { background: var(--success); }

.btn-row { display: flex; gap: 10px; margin-top: 14px; }
.btn-row > .btn { flex: 1; }

/* ═══ INPUTS ═══ */
input, select {
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px 14px;
  font-size: 16px;
  color: var(--text);
  transition: border-color 0.2s, box-shadow 0.2s;
  appearance: none; -webkit-appearance: none;
}
input:focus, select:focus {
  border-color: var(--signal);
  box-shadow: 0 0 0 3px var(--signal-glow);
  outline: none;
}
input::placeholder { color: var(--text-faint); }
label {
  display: block;
  font: 500 12px/1 var(--mono);
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-bottom: 6px;
}

/* ═══ PANELS ═══ */
.panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 16px;
  margin: 12px 0;
}
.panel.highlight {
  border-color: var(--signal);
  background: linear-gradient(135deg, rgba(61,90,254,0.06) 0%, var(--surface) 100%);
}
.panel.alert {
  border-color: var(--danger);
  background: linear-gradient(135deg, rgba(255,61,87,0.06) 0%, var(--surface) 100%);
}

/* ═══ ROOM CODE ═══ */
.room-code {
  font: 700 clamp(32px, 9vw, 42px)/1 var(--mono);
  letter-spacing: 0.2em;
  color: var(--signal);
  text-align: center;
  user-select: all;
  padding: 8px 0;
}

/* ═══ PLAYER SLOTS ═══ */
.slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; }
.slot {
  position: relative;
  text-align: center;
  padding: 10px 6px 8px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  font-size: 13px;
  overflow: hidden;
  word-break: break-word;
  transition: border-color 0.2s, box-shadow 0.2s, transform 0.2s;
  animation: slot-in 0.3s var(--ease-bounce);
}
@keyframes slot-in { from { transform: scale(0.8); opacity: 0; } }

.slot.empty {
  opacity: 0.25;
  border-style: dashed;
  min-height: 100px;
  display: grid;
  place-items: center;
  color: var(--text-faint);
  font-family: var(--mono);
  font-size: 11px;
}
.slot.me { border-color: var(--signal); box-shadow: 0 0 0 1px var(--signal-glow); }
.slot.off { opacity: 0.45; }
.slot b { display: block; margin-top: 4px; font-weight: 600; font-size: 13px; }
.tag {
  display: block;
  font: 500 10px/1.2 var(--mono);
  color: var(--text-faint);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin-top: 3px;
}
.tag.ok { color: var(--success); }
.host-crown { color: var(--warn); font-size: 11px; }

/* Talking states */
.slot.talk {
  border-color: var(--success);
  box-shadow: 0 0 12px rgba(0,230,118,0.2);
}
.slot.talk .av { animation: talk-bounce 0.35s ease-in-out infinite alternate; }
@keyframes talk-bounce { to { transform: translateY(-4px) scale(1.04); } }

/* Vote spotlight */
.slot.spot {
  border-color: var(--danger);
  box-shadow: 0 0 16px var(--danger-glow);
}
.slot.pick {
  border-color: var(--warn);
  box-shadow: 0 0 12px rgba(255,171,0,0.25);
  transform: scale(1.03);
}
.slot.dead .av { animation: none; transform: rotate(80deg) scale(0.8); filter: grayscale(1) brightness(0.6); }

/* ═══ AVATARS ═══ */
.av {
  width: 56px; height: 56px;
  display: block;
  margin: 0 auto;
  animation: float 4s ease-in-out infinite;
}
@keyframes float { 50% { transform: translateY(-2px); } }

/* Wave indicator */
.wave { display: inline-flex; gap: 2px; height: 10px; align-items: flex-end; }
.wave i { display: block; width: 2px; background: var(--signal); height: 3px; border-radius: 1px; }
.talk .wave i { animation: wave-pulse 0.4s infinite alternate; }
.wave i:nth-child(2) { animation-delay: 0.1s; }
.wave i:nth-child(3) { animation-delay: 0.2s; }
@keyframes wave-pulse { to { height: 10px; } }

/* ═══ REVEAL CARD ═══ */
.reveal-card {
  perspective: 1000px;
  margin: 24px auto;
  max-width: 360px;
}
.reveal-card > div {
  padding: 32px 20px;
  text-align: center;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  background: var(--surface);
  animation: card-flip 0.6s var(--ease-out) both;
  position: relative;
  overflow: hidden;
}
.reveal-card > div::before {
  content: "";
  position: absolute; inset: 0;
  background: linear-gradient(135deg, rgba(255,255,255,0.03) 0%, transparent 50%);
  pointer-events: none;
}
.reveal-card.crew > div {
  border-color: var(--signal);
  background: linear-gradient(180deg, rgba(61,90,254,0.08) 0%, var(--surface) 100%);
}
.reveal-card.imp > div {
  border-color: var(--danger);
  background: linear-gradient(180deg, rgba(255,61,87,0.1) 0%, rgba(30,10,12,0.9) 100%);
}
.secret-word {
  font: 700 clamp(24px, 6vw, 32px)/1.2 var(--mono);
  color: var(--signal);
  word-break: break-word;
  margin: 12px 0;
  letter-spacing: 0.04em;
}
.reveal-card.imp .secret-word { color: var(--danger); }
@keyframes card-flip { from { transform: rotateY(90deg); opacity: 0; } }

/* ═══ TIMER ═══ */
.timer {
  font: 700 clamp(20px, 5.5vw, 26px)/1 var(--mono);
  color: var(--text);
  transition: color 0.3s;
}
.timer.urgent { color: var(--danger); animation: timer-flash 0.5s ease-in-out infinite; }
@keyframes timer-flash { 50% { opacity: 0.6; } }

/* ═══ VOTE GRID ═══ */
.vote-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
}
.vote-grid button.slot {
  min-height: 110px;
  color: inherit;
  cursor: pointer;
  transition: all 0.15s var(--ease-out);
}
.vote-grid button.slot:hover:not([disabled]) {
  border-color: var(--warn);
  background: var(--surface2);
}

/* ═══ HEADER ROW ═══ */
.hdr {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 12px;
}
.hdr-left { display: flex; flex-direction: column; gap: 4px; }

/* ═══ TALLY ═══ */
.tally { font: 700 clamp(16px, 4.5vw, 20px)/1 var(--mono); color: var(--danger); }

/* ═══ HOME SCREEN ═══ */
.home-hero {
  text-align: center;
  padding: clamp(8vh, 12vh, 16vh) 0 24px;
  animation: hero-in 0.7s var(--ease-out);
}
.home-hero h1 {
  font-size: clamp(32px, 10vw, 52px);
  background: linear-gradient(135deg, var(--text) 0%, var(--text-dim) 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
}
.home-hero .subtitle {
  font: 500 clamp(12px, 3vw, 14px)/1.4 var(--mono);
  color: var(--danger);
  letter-spacing: 0.15em;
  text-transform: uppercase;
  margin-top: 4px;
}
.home-hero .tagline {
  color: var(--text-dim);
  font-size: 14px;
  margin-top: 12px;
  max-width: 300px;
  margin-left: auto; margin-right: auto;
}
@keyframes hero-in { from { opacity: 0; transform: translateY(12px); } }

.session-banner {
  text-align: center;
  border-color: var(--signal);
  animation: slot-in 0.3s var(--ease-bounce);
}

/* ═══ ROUND INTRO ═══ */
.intro-screen {
  text-align: center;
  padding: clamp(18vh, 25vh, 30vh) 0;
  animation: intro-in 0.6s var(--ease-out);
}
.intro-screen h1 {
  font-size: clamp(36px, 12vw, 56px);
  color: var(--text);
  letter-spacing: 0.06em;
}
.intro-screen .intro-sub {
  color: var(--danger);
  font: 500 14px/1.4 var(--mono);
  letter-spacing: 0.08em;
  margin-top: 8px;
  animation: intro-sub-in 0.6s 0.3s var(--ease-out) both;
}
@keyframes intro-in { from { opacity: 0; transform: scale(1.1); } }
@keyframes intro-sub-in { from { opacity: 0; transform: translateY(8px); } }

/* ═══ SPEAKER ═══ */
.speaker-block { text-align: center; }
.speaker-block .av { width: 80px; height: 80px; }
.speaker-block h3 { color: var(--signal); margin-top: 8px; }

/* ═══ CLUE LIST ═══ */
.clue-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg);
  padding: 8px 12px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  font-size: 13px;
}
.clue-item .clue-author {
  display: flex; align-items: center; gap: 6px;
}
.clue-item .clue-author .av { width: 24px; height: 24px; }
.clue-word {
  font-family: var(--mono);
  font-weight: 600;
  color: var(--signal);
}
.clue-word.timeout { color: var(--text-faint); font-style: italic; }

/* ═══ RESULT SCREEN ═══ */
.result-banner {
  text-align: center;
  padding: 28px 16px;
  border-radius: var(--radius-lg);
  margin-bottom: 16px;
  animation: result-in 0.5s var(--ease-out);
}
.result-banner.crew-win {
  background: linear-gradient(135deg, rgba(0,230,118,0.08), var(--surface));
  border: 1px solid rgba(0,230,118,0.3);
}
.result-banner.imp-win {
  background: linear-gradient(135deg, rgba(255,61,87,0.08), var(--surface));
  border: 1px solid rgba(255,61,87,0.3);
}
.result-banner h1 { margin-bottom: 8px; }
@keyframes result-in { from { opacity: 0; transform: scale(0.95); } }

.result-word {
  font: 700 clamp(22px, 6vw, 30px)/1.2 var(--mono);
  color: var(--signal);
  padding: 16px;
  text-align: center;
}

/* ═══ BOTTOM BAR ═══ */
.bar {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  z-index: 15;
  display: flex;
  gap: 8px;
  align-items: center;
  padding: 8px 14px var(--safe-b);
  background: rgba(9,9,15,0.92);
  border-top: 1px solid var(--border);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}
.bar button {
  width: auto; min-width: 44px; min-height: 44px;
  padding: 0 10px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  font-size: 18px;
  transition: background 0.15s, border-color 0.15s;
}
.bar button:hover { background: var(--surface3); }
.bar button.on {
  background: var(--signal);
  border-color: var(--signal);
  color: #fff;
}
.bar .st {
  flex: 1;
  font: 500 12px/1.3 var(--mono);
  color: var(--text-dim);
  letter-spacing: 0.02em;
}

/* ═══ TOAST ═══ */
.toast {
  position: fixed;
  top: calc(var(--safe-t) + 8px);
  left: 50%;
  transform: translateX(-50%);
  background: var(--text);
  color: var(--bg);
  padding: 10px 18px;
  border-radius: var(--radius);
  z-index: 200;
  max-width: 90vw;
  font: 600 13px/1.3 var(--sans);
  box-shadow: 0 8px 30px rgba(0,0,0,0.5);
  animation: toast-in 0.25s var(--ease-bounce);
}
@keyframes toast-in { from { transform: translateX(-50%) translateY(-12px); opacity: 0; } }

/* ═══ CONNECTION BANNER ═══ */
.conn-bar {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 300;
  text-align: center;
  padding: 6px 12px;
  font: 600 12px/1 var(--mono);
  background: var(--danger);
  color: #fff;
  letter-spacing: 0.04em;
  animation: toast-in 0.25s var(--ease-bounce);
}

/* ═══ CHAT DRAWER ═══ */
.cbadge {
  position: absolute; top: -4px; right: -4px;
  background: var(--danger);
  color: #fff;
  border-radius: 10px;
  padding: 2px 6px;
  font-size: 10px;
  font-weight: 700;
  line-height: 1;
  box-shadow: 0 0 8px var(--danger-glow);
  animation: slot-in 0.2s var(--ease-bounce);
}
.chat-drawer {
  position: fixed;
  left: 50%; bottom: 0;
  transform: translate(-50%, 105%);
  width: 100%; max-width: 520px;
  height: 72vh; max-height: 560px;
  background: rgba(9,9,15,0.96);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-top: 1px solid var(--signal);
  border-left: 1px solid var(--border);
  border-right: 1px solid var(--border);
  border-top-left-radius: var(--radius-lg);
  border-top-right-radius: var(--radius-lg);
  z-index: 50;
  display: flex; flex-direction: column;
  transition: transform 0.3s var(--ease-out), opacity 0.2s;
  box-shadow: 0 -12px 40px rgba(0,0,0,0.6);
  pointer-events: none;
  opacity: 0;
}
.chat-drawer.open { transform: translate(-50%, 0); pointer-events: auto; opacity: 1; }
.chat-hdr {
  display: flex; justify-content: space-between; align-items: center;
  padding: 12px 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  border-top-left-radius: var(--radius-lg);
  border-top-right-radius: var(--radius-lg);
}
.chat-hdr h3 { font-size: 13px; margin: 0; color: var(--signal); letter-spacing: 0.1em; }
.chat-hdr .live-dot {
  display: inline-block;
  width: 6px; height: 6px;
  background: var(--success);
  border-radius: 50%;
  margin-left: 8px;
  animation: pulse-dot 2s ease-in-out infinite;
  vertical-align: middle;
}
.chat-close {
  background: transparent;
  color: var(--text-dim);
  font-size: 20px; line-height: 1;
  border: 0; cursor: pointer;
  padding: 4px 8px; min-height: 36px;
  border-radius: var(--radius);
  transition: color 0.15s, background 0.15s;
}
.chat-close:hover { color: var(--text); background: var(--surface2); }
.chat-msgs {
  flex: 1;
  overflow-y: auto;
  padding: 12px 14px;
  display: flex; flex-direction: column; gap: 10px;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
}
.chat-empty { text-align: center; color: var(--text-faint); margin: auto; font-size: 13px; font-family: var(--mono); }
.cmsg { display: flex; gap: 8px; max-width: 88%; animation: slot-in 0.2s var(--ease-out); }
.cmsg.me { align-self: flex-end; flex-direction: row-reverse; }
.cmsg-av { width: 28px; height: 28px; flex-shrink: 0; }
.cmsg-av .av { width: 28px; height: 28px; }
.cmsg-wrap { display: flex; flex-direction: column; }
.cmsg.me .cmsg-wrap { align-items: flex-end; }
.cmsg-meta { font: 500 10px/1 var(--mono); color: var(--text-faint); margin-bottom: 3px; letter-spacing: 0.04em; }
.cmsg.me .cmsg-meta { color: var(--signal); }
.cmsg-txt {
  background: var(--surface2);

// ═══ CONFIG ═══

try{soundOn=localStorage.getItem('imp-snd')!=='0'}catch{}

// ═══ PROCEDURAL AUDIO ENGINE ═══
let ac;
function unlockAudio(){
  if(ac&&ac.state==='suspended')ac.resume().catch(()=>{});
  document.querySelectorAll('audio').forEach(a=>{if(a.paused&&a.srcObject)a.play().catch(()=>{})});
}
['click','touchstart','keydown'].forEach(ev=>window.addEventListener(ev,unlockAudio,{passive:true}));

function getAudioCtx() {
  if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
  if (ac.state === 'suspended') ac.resume().catch(() => {});
  return ac;
}

function beep(f, d = 0.12, t = 'square', v = 0.04) {
  if (!soundOn) return;
  try {
    const ctx = getAudioCtx();
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = t;
    o.frequency.setValueAtTime(f, ctx.currentTime);
    g.gain.setValueAtTime(v, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + d);
    o.connect(g).connect(ctx.destination);
    o.start();
    o.stop(ctx.currentTime + d);
  } catch {}
}

function radioNoise(duration = 0.08, volume = 0.025, bandFreq = 1800) {
  if (!soundOn) return;
  try {
    const ctx = getAudioCtx();
    const bufferSize = Math.max(128, Math.floor(ctx.sampleRate * duration));
    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      data[i] = (Math.random() * 2 - 1);
    }
    const noise = ctx.createBufferSource();
    noise.buffer = buffer;

    const filter = ctx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.setValueAtTime(bandFreq, ctx.currentTime);
    filter.Q.setValueAtTime(2.2, ctx.currentTime);

    const gain = ctx.createGain();
    gain.gain.setValueAtTime(volume, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);

    noise.connect(filter).connect(gain).connect(ctx.destination);
    noise.start();
  } catch {}
}

// Named sound events

};

let connBanner=null;

// ═══ AVATARS (Original Tactical Radio Operator Insignia) ═══
const PALETTE = ['#3d5afe','#ff3d57','#00e676','#ffab00','#e040fb','#00bcd4','#ff6e40','#7c4dff'];
function avatar(seed) {
  const c = PALETTE[seed % 8];
  const e = ['#80ffea', '#ffe066', '#ffffff', '#ff80bf'][(seed >> 3) % 4];
  const pattern = (seed >> 5) % 4;
  const ringDash = ['none', '4 2', '8 3', '2 2'][(seed >> 7) % 4];

  const h1 = 6 + (seed & 7) * 1.8;
  const h2 = 8 + ((seed >> 2) & 7) * 2.2;
  const h3 = 12 + ((seed >> 4) & 7) * 2.5;
  const h4 = 7 + ((seed >> 6) & 7) * 2.0;
  const h5 = 5 + ((seed >> 8) & 7) * 1.5;

  let centerGraphic = '';
  if (pattern === 0) {
    centerGraphic = `
      <rect x="29" y="${40 - h1/2}" width="3" height="${h1}" rx="1.5" fill="${c}" opacity="0.85"/>
      <rect x="34.5" y="${40 - h2/2}" width="3" height="${h2}" rx="1.5" fill="${e}" opacity="0.95"/>
      <rect x="40" y="${40 - h3/2}" width="3" height="${h3}" rx="1.5" fill="#ffffff"/>
      <rect x="45.5" y="${40 - h4/2}" width="3" height="${h4}" rx="1.5" fill="${e}" opacity="0.95"/>
      <rect x="51" y="${40 - h5/2}" width="3" height="${h5}" rx="1.5" fill="${c}" opacity="0.85"/>
    `;
  } else if (pattern === 1) {
    const angle = ((seed * 47) % 360) * (Math.PI / 180);
    const sx = 40 + Math.cos(angle) * 16;
    const sy = 40 + Math.sin(angle) * 16;
    centerGraphic = `
      <circle cx="40" cy="40" r="15" fill="none" stroke="${c}" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.7"/>
      <circle cx="40" cy="40" r="7" fill="none" stroke="${e}" stroke-width="1"/>
      <line x1="40" y1="40" x2="${sx.toFixed(1)}" y2="${sy.toFixed(1)}" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
      <circle cx="${sx.toFixed(1)}" cy="${sy.toFixed(1)}" r="2" fill="${e}"/>
      <circle cx="40" cy="40" r="2.5" fill="${c}"/>
    `;
  } else if (pattern === 2) {
    centerGraphic = `
      <path d="M 28 40 Q 34 ${40 - h3/2} 40 40 T 52 40" fill="none" stroke="${e}" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="40" cy="40" r="3" fill="#ffffff"/>
      <line x1="28" y1="40" x2="52" y2="40" stroke="${c}" stroke-width="1" stroke-dasharray="2 2" opacity="0.5"/>
    `;
  } else {
    centerGraphic = `
      <circle cx="40" cy="40" r="14" fill="none" stroke="${c}" stroke-width="1.5" opacity="0.6"/>
      <circle cx="40" cy="40" r="9" fill="none" stroke="${e}" stroke-width="2" opacity="0.9"/>
      <circle cx="40" cy="40" r="4" fill="#ffffff"/>
    `;
  }

  return `<svg class="av" viewBox="0 0 80 80" aria-hidden="true">
    <circle cx="40" cy="40" r="36" fill="#0d0d16" stroke="${c}" stroke-width="2" stroke-dasharray="${ringDash}"/>
    <circle cx="40" cy="40" r="30" fill="#141422" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <line x1="16" y1="40" x2="64" y2="40" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    <line x1="40" y1="16" x2="40" y2="64" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    <path d="M 23 41 A 17 17 0 0 1 57 41" fill="none" stroke="${c}" stroke-width="3" stroke-linecap="round"/>
    <rect x="18" y="34" width="7" height="15" rx="3.5" fill="${c}"/>
    <rect x="55" y="34" width="7" height="15" rx="3.5" fill="${c}"/>
    ${centerGraphic}
    <path d="M 22 46 Q 26 57 37 57" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round"/>
    <circle cx="38" cy="57" r="2.2" fill="${e}"/>
    <line x1="40" y1="23" x2="40" y2="10" stroke="${c}" stroke-width="2"/>
    <circle cx="40" cy="8" r="3" fill="${c}"/>
    <circle cx="40" cy="8" r="1.5" fill="#ffffff"/>
  </svg>`;
}

const wave = '<span class="wave" aria-hidden="true"><i></i><i></i><i></i></span>';

// Roster resolver
const P = id => {
  if (S?.result?.players) {

// ═══ CONNECTION ═══
function connect(first) {
  clearTimeout(connect.t);
  try {
    let targetHost = window.SERVER_HOST;
    if (!targetHost) {
      if (!location.host || location.protocol === 'file:') {
        targetHost = 'localhost:3000';
      } else if ((location.hostname === 'localhost' || location.hostname === '127.0.0.1') && location.port !== '3000') {
        targetHost = `${location.hostname}:3000`;
      } else {
        targetHost = location.host;
      }
    }
    const proto = (location.protocol === 'https:' && !targetHost.includes('localhost')) ? 'wss://' : 'ws://';
    ws = new WebSocket(proto + targetHost);

    ws.onopen = () => {
      retry = 0;
      wsConnected = true;
      hideConnBanner();
      if (me) tx({ t: 'resume', code: me.code, id: me.id, token: me.token });
      updateVoiceUI();
    };

    ws.onmessage = e => {
      let m;
      try { m = JSON.parse(e.data) } catch { return }
      if (m.t === 'pong') return;
      if (m.t === 'joined') {
        me = { code: m.code, id: m.id, token: m.token };
        try { localStorage.setItem('imp-session', JSON.stringify(me)) } catch {}
      } else if (m.t === 'state') {
        const prev = S; S = m.s; onState(prev);
      } else if (m.t === 'error') {
        toast(m.msg);
        if (/expired|not found/i.test(m.msg)) {
          me = null; S = null;
          try { localStorage.removeItem('imp-session') } catch {}
          render();
        }
      } else if (m.t === 'rtc') {
        onRtc(m);
      } else if (m.t === 'speaking') {
        if (m.v) talking.add(m.id); else talking.delete(m.id);
        document.querySelectorAll(`[data-id="${m.id}"]`).forEach(el => el.classList.toggle('talk', !!m.v));
      } else if (m.t === 'chat') {
        addChatMessage(m);
      } else if (m.t === 'chat_rejected') {
        toast('🚫 ' + (m.msg || 'Message blocked.'));
      } else if (m.t === 'clue_rejected') {
        toast('⚠️ ' + (m.msg || 'Clue rejected.'));
      }
    };

    ws.onclose = () => {
      wsConnected = false;
      if (S) showConnBanner('Connection lost — reconnecting…');
      const delay = Math.min(10000, 500 * Math.pow(1.5, retry++));
      connect.t = setTimeout(() => connect(false), delay);
    };

    ws.onerror = () => {};
  } catch (err) {
    console.warn('WebSocket init error:', err);
    wsConnected = false;
    const delay = Math.min(10000, 500 * Math.pow(1.5, retry++));
    connect.t = setTimeout(() => connect(false), delay);
  }
}

const tx = m => { if (ws && ws.readyState === 1) ws.send(JSON.stringify(m)); else toast('Connecting…') };

// Keep-alive heartbeat
setInterval(() => {
  if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ t: 'ping' }));
}, 25000);

function onState(prev) {
  hideConnBanner();
  // Phase-specific audio
  if (!prev || prev.phase !== S.phase) {
    const phase = S.phase;
    if (phase === 'reveal') sfx.reveal();
    else if (phase === 'vote' || phase === 'voting') sfx.tension();
    else if (phase === 'verdict') sfx.verdict();
    else if (phase === 'result' || phase === 'results') {
      const isWin = S.result && ((S.result.winner === 'impostor') === (S.result.impostor === S.you));
      isWin ? sfx.win() : sfx.lose();
    } else sfx.click();
  }
  if (prev && S.players.length > prev.players.length) sfx.join();
  if (prev && S.game && S.game.speaker === S.you && prev.game?.speaker !== S.you) sfx.turn();
  if (S.phase !== 'vote' && S.phase !== 'voting' && S.phase !== 'revote' && S.phase !== 'tie_revote') sel = null;
  if (S.notice && (!prev || prev.notice !== S.notice)) toast(S.notice);
  if (S.phase === 'reveal' && introShown !== S.round) { introShown = S.round; intro() } else render();
  syncPeers();
}

function intro() {
  app.innerHTML = `<div class="intro-screen">
    <div class="phase-label">ROUND STARTING</div>
    <h1>ROUND ${String(S.round).padStart(2, '0')}</h1>
    <p class="intro-sub">Someone is not who they claim to be.</p>
  </div>`;
  setTimeout(() => { if (S && S.phase === 'reveal') render() }, 2200);
}

      lobby,

    }[S.phase];

    app.innerHTML = f();
    bind();
  } catch (err) {
    console.error('Render error:', err);
    if (app) app.innerHTML = `<div class="panel alert" style="text-align:center"><h3 style="color:var(--danger)">Display Error</h3><p class="dim">${esc(err.message)}</p><button class="btn alt" onclick="location.reload()">Reload</button></div>`;
  }
}

  app.innerHTML = `

    <div class="panel">
      <label for="cd">Room Code</label>
      <input id="cd" maxlength="6" autocapitalize="characters" autocomplete="off" enterkeyhint="go" inputmode="text" style="text-transform:uppercase;font-family:var(--mono);letter-spacing:0.15em" placeholder="XXXXXX">
      <div class="gap-sm"></div>
      <button class="btn alt" id="jn">Join Room</button>
    </div>`;

  const cl = $('#cl-session');
  if (cl) cl.onclick = () => { me = null; try { localStorage.removeItem('imp-session') } catch {} render() };
  const nm = () => $('#nm').value.trim() || (toast('Enter a name first.'), '');
  $('#mk').onclick = () => { const n = nm(); if (n) tx({ t: 'create', name: n }) };
  $('#jn').onclick = () => { const n = nm(), c = $('#cd').value.trim().toUpperCase(); if (!n) return; if (c.length !== 6) return toast('Room codes are 6 characters.'); tx({ t: 'join', name: n, code: c }) };
  $('#cd').onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); $('#jn').click() } };
  $('#nm').onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); $('#cd')?.focus() } };
}

function lobby() {
  const host = S.hostId === S.you, meP = P(S.you), n = S.players.length;
  const empty = Array.from({ length: Math.max(0, 4 - n) }, () => '<div class="slot empty">OPEN</div>').join('');
  const others = S.players.filter(p => p.id !== S.hostId && !p.spectator);
  const ok = n >= 4 && others.every(p => p.ready);

  let startLabel = 'START GAME';
  if (n < 4) startLabel = `NEED ${4 - n} MORE`;
  else if (!ok) startLabel = 'WAITING FOR READY';

  return `
    <div class="hdr">
      <div class="hdr-left">
        <div class="phase-label">LOBBY</div>
        <h2>ROOM</h2>
      </div>
      <button class="btn alt" id="lv" style="width:auto;flex:0;font-size:13px;min-height:40px;padding:0 14px">Leave</button>
    </div>
    <div class="panel highlight" style="text-align:center">
      <div class="room-code" id="cc">${S.code}</div>
      <button class="btn alt" id="cp" style="font-size:13px;min-height:40px">📋 Copy invite code</button>
    </div>
    <p class="dim" style="font:500 12px/1 var(--mono);letter-spacing:0.06em;margin:14px 0 8px">${n} / 10 PLAYERS</p>
    <div class="slots">${S.players.map(p => slot(p)).join('')}${empty}</div>
    ${host ? `
      <div class="panel">
        <label for="cat">Category</label>
        <select id="cat">
          <option value="RANDOM">Random each round</option>
          ${CATS.map(c => `<option ${S.category === c ? 'selected' : ''}>${esc(c)}</option>`).join('')}
        </select>
      </div>
      <button class="btn ${ok ? '' : 'alt'}" id="go" ${ok ? '' : 'disabled'}>${startLabel}</button>
    ` : `
      <div class="gap-md"></div>
      <button class="btn ${meP.ready ? 'success' : 'alt'}" id="rd">${meP.ready ? '● READY' : "READY UP"}</button>
    `}`;
}

function reveal() {

  const imp = S.secret && S.secret.impostor;
  return `
    <div class="hdr">
      <div class="phase-label">ROLE REVEAL</div>

      <div>
        ${imp
          ? `<p class="dim" style="font:500 11px/1 var(--mono);letter-spacing:0.1em;margin-bottom:12px">YOUR ROLE</p>
             <div class="secret-word">YOU ARE THE IMPOSTER</div>
             <p style="margin:12px 0 0;font-size:14px;color:var(--text-dim)">You don't know the secret word. Blend in.</p>
             <div class="gap-sm"></div>

          : `<p class="dim" style="font:500 11px/1 var(--mono);letter-spacing:0.1em;margin-bottom:12px">YOUR SECRET WORD</p>

function clues() {
  const isSpectator = S.spectator;
  const isMyTurn = S.game.activeSpeaker === S.you;
  const activeSpeakerName = P(S.game.activeSpeaker).name;
  const clueCount = S.game.clues.length;
  const totalClues = S.game.order.length;

  let turnAction = '';
  if (isSpectator) {
    turnAction = `<div class="panel" style="text-align:center"><p class="dim">Spectating this round.</p></div>`;
  } else if (isMyTurn) {
    turnAction = `<div class="panel alert" style="text-align:center">
      <h3 style="color:var(--danger);margin-bottom:8px">YOUR TURN</h3>
      <p class="dim" style="font-size:12px;margin-bottom:12px">Submit exactly one word. No duplicates or secret word.</p>
      <div style="display:flex;gap:8px">
        <input id="clue-in" maxlength="24" placeholder="One-word clue…" autocomplete="off" enterkeyhint="go" style="flex:1">
        <button class="btn danger" id="clue-sub" style="width:auto;min-width:90px;padding:0 14px">Submit</button>
      </div>
    </div>`;
  } else {
    turnAction = `<div class="panel" style="text-align:center">
      <p class="dim">Waiting for <b class="signal-text">${esc(activeSpeakerName)}</b> to submit a clue…</p>
    </div>`;
  }

  let roleHint = '';
  if (S.secret && S.secret.impostor) {
    roleHint = `<p class="dim text-center" style="font-size:12px;color:var(--danger)">You are the imposter · Category: <b>${esc(S.game.category)}</b> · Fake a convincing clue</p>`;
  } else if (S.secret && S.secret.word) {
    roleHint = `<p class="dim text-center" style="font-size:12px">Category: <b>${esc(S.game.category)}</b> · Word: <b class="signal-text">${esc(S.secret.word)}</b></p>`;
  }

  const cluesList = clueCount
    ? `<div class="panel">
        <label style="margin-bottom:10px">Clues ${clueCount}/${totalClues}</label>
        <div style="display:flex;flex-direction:column;gap:6px">
          ${S.game.clues.map(c => `<div class="clue-item">
            <span class="clue-author">${avatar(P(c.pid).seed)} <b>${esc(P(c.pid).name)}</b></span>
            <span class="clue-word ${c.timedOut ? 'timeout' : ''}">${esc(c.text)}</span>
          </div>`).join('')}

    : `<div class="panel text-center"><p class="dim" style="font-size:13px">No clues yet.</p></div>`;

  return `
    <div class="hdr">
      <div class="hdr-left">

    <div class="panel">
      <label style="margin-bottom:8px">Speaking order</label>
      <div class="slots">${S.game.order.map((id, i) =>
        slot(P(id), id === S.game.activeSpeaker ? 'spot' : i < S.game.clueIndex ? 'off' : '')
      ).join('')}</div>
    </div>
    ${cluesList}`;
}

function discussion() {

  } else if (S.secret && S.secret.word) {

  const clueSummary = S.game.clues.length

// ═══ EVENT BINDING ═══
function bind() {
  const on = (s, f) => { const e = $(s); if (e) e.onclick = () => { sfx.click(); f(e) } };
  on('#lv', () => { tx({ t: 'leave' }); try { localStorage.removeItem('imp-session') } catch {} me = null; S = null; closeAllPeers(); render() });
  on('#cp', () => {
    const text = S.code;
    if (navigator.share) { navigator.share({ title: 'Join my Imposter game!', text: `Join my game: ${text}` }).catch(() => {}) }
    else if (navigator.clipboard) { navigator.clipboard.writeText(text).then(() => toast('Room code copied!'), () => toast('Press and hold the code to copy.')) }
    else { toast('Press and hold the code to copy.') }
  });
  on('#rd', () => tx({ t: 'ready', v: !P(S.you).ready }));
  on('#go', () => tx({ t: 'start' }));
  on('#nx', () => tx({ t: 'next' }));
  on('#ag', () => tx({ t: 'again' }));
  const cat = $('#cat'); if (cat) cat.onchange = () => tx({ t: 'category', v: cat.value });

  // Clue submission
  const clueSub = $('#clue-sub');
  if (clueSub) {
    clueSub.onclick = () => {
      const inp = $('#clue-in');
      const val = (inp?.value || '').trim();
      if (!val) return toast('Type a clue first.');
      tx({ t: 'clue', word: val, roundId: S?.roundId });
    };
  }
  const clueIn = $('#clue-in');
  if (clueIn) {
    clueIn.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); $('#clue-sub')?.click() } };
  }

  // Discussion ready
  on('#rd-disc', () => tx({ t: 'ready_discuss', v: !P(S.you).discussReady, roundId: S?.roundId }));

  // Voting
  document.querySelectorAll('[data-v]').forEach(b => b.onclick = () => { if (!S.game.voted.includes(S.you)) { sel = b.dataset.v; render() } });
  on('#cast', () => { tx({ t: 'vote', target: sel, roundId: S?.roundId }); sfx.vote() });

  // Revoting
  document.querySelectorAll('[data-rv]').forEach(b => b.onclick = () => { if (!S.game.revoted.includes(S.you)) { sel = b.dataset.rv; render() } });
  on('#cast-revote', () => { tx({ t: 'revote', target: sel, roundId: S?.roundId }); sfx.vote() });

  // Final guess
  const guessSub = $('#guess-sub');
  if (guessSub) {
    guessSub.onclick = () => {
      const inp = $('#guess-in');
      const val = (inp?.value || '').trim();
      if (!val) return toast('Type your guess first.');
      tx({ t: 'guess', word: val, roundId: S?.roundId });
    };
  }
  const guessIn = $('#guess-in');
  if (guessIn) {
    guessIn.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); $('#guess-sub')?.click() } };
  }
}

// ═══ TIMER ═══
let timerInterval = null;
function startTimer() {
  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    const t = $('#tm');
    if (t && S?.deadline) {
      const left = Math.max(0, Math.ceil((S.deadline - Date.now()) / 1000));
      t.textContent = left + 's';
      t.classList.toggle('urgent', left <= 10);
    }
  }, 250);
}
startTimer();

// ═══ VOICE (WebRTC mesh) ═══
const peers = new Map();
const iceQueues = new Map();
let stream = null;

let micState = 'disabled';
let voiceConnState = 'none';

function recomputeVoiceConnState() {
  if (!stream || !peers.size) {
    voiceConnState = 'none';
    updateVoiceUI();
    return;
  }
  const states = [...peers.values()].map(p => p.pc.connectionState);
  if (states.some(s => s === 'connected')) voiceConnState = 'connected';
  else if (states.some(s => s === 'connecting' || s === 'new')) voiceConnState = 'connecting';
  else if (states.some(s => s === 'disconnected')) voiceConnState = 'degraded';
  else if (states.every(s => s === 'failed' || s === 'closed')) voiceConnState = 'failed';
  else voiceConnState = 'connecting';
  updateVoiceUI();
}

function updateVoiceUI() {
  const el = $('#vst'), btn = $('#mic');
  if (!el || !btn) return;

  btn.classList.toggle('on', micState === 'enabled');
  btn.textContent = micState === 'enabled' ? '🎙' : (micState === 'muted' ? '🔇' : '🎙');

  let text = '';
  if (micState === 'denied') text = '🚫 Mic denied';
  else if (micState === 'disabled') text = 'Tap 🎙 for voice';
  else {
    const ml = micState === 'enabled' ? 'MIC LIVE' : 'MIC MUTED';
    if (voiceConnState === 'none') text = `🎙 ${ml}`;
    else if (voiceConnState === 'connecting') text = `🟡 Connecting… ${ml}`;
    else if (voiceConnState === 'connected') text = micState === 'enabled' ? '🟢 VOICE LIVE' : '🔇 CONNECTED';
    else if (voiceConnState === 'degraded') text = `🟠 Degraded · ${ml}`;
    else if (voiceConnState === 'reconnecting') text = `🔄 Reconnecting…`;
    else if (voiceConnState === 'failed') text = HAS_TURN ? '❌ Failed' : '❌ Failed (needs TURN)';
  }
  el.textContent = text;
}

$('#mic').onclick = async () => {
  unlockAudio();
  if (!stream) {
    if (!window.isSecureContext) {
      micState = 'denied';
      toast('Voice requires HTTPS or localhost.');
      return updateVoiceUI();
    }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      micState = 'denied';
      toast('Browser does not support microphone.');
      return updateVoiceUI();
    }
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
      });
      micState = 'enabled';
      watch(stream, S?.you);
      peers.forEach(p => {
        if (p.tx?.sender && stream.getAudioTracks().length) {
          p.tx.sender.replaceTrack(stream.getAudioTracks()[0]);
        }
      });
      syncPeers();
      toast('Microphone connected');
    } catch (e) {
      micState = 'denied';
      if (e.name === 'NotAllowedError' || e.name === 'PermissionDeniedError') toast('Mic permission denied.');
      else if (e.name === 'NotFoundError') toast('No microphone found.');
      else toast('Could not access microphone.');
    }
  } else {
    const nextState = micState === 'enabled' ? 'muted' : 'enabled';
    micState = nextState;
    stream.getAudioTracks().forEach(t => { t.enabled = (nextState === 'enabled'); });
    if (nextState === 'muted') {
      lastSpoke = false;
      tx({ t: 'speaking', v: false });
      talking.delete(S?.you);
      document.querySelectorAll(`[data-id="${S?.you}"]`).forEach(e => e.classList.remove('talk'));
    }
  }
  updateVoiceUI();
};

function syncPeers() {
  if (!S) return;
  const ids = S.players.filter(p => p.connected && p.id !== S.you).map(p => p.id);
  [...peers.keys()].filter(id => !ids.includes(id)).forEach(closePeer);
  ids.forEach(id => {
    if (!peers.has(id) && S.you < id) makePeer(id, true);
  });
  recomputeVoiceConnState();
}

function makePeer(id, init) {
  const pc = new RTCPeerConnection({ iceServers: ICE_SERVERS });
  const t = pc.addTransceiver('audio', { direction: 'sendrecv' });
  if (stream && stream.getAudioTracks().length) {
    t.sender.replaceTrack(stream.getAudioTracks()[0]);
  }
  const p = { pc, tx: t, init, disconnectTimer: null };
  peers.set(id, p);

  pc.onicecandidate = e => {
    if (e.candidate) tx({ t: 'rtc', to: id, data: { ice: e.candidate } });
  };

  pc.ontrack = e => {
    let a = document.getElementById('a-' + id);
    if (!a) {
      a = document.createElement('audio');
      a.id = 'a-' + id;
      a.autoplay = true;
      a.playsInline = true;
      document.body.append(a);
    }
    a.srcObject = e.streams[0];
    a.play().catch(err => console.warn('Autoplay prevented:', id, err));
    watch(e.streams[0], id);
  };

  pc.onconnectionstatechange = () => {
    const st = pc.connectionState;
    if (st === 'connected') {
      clearTimeout(p.disconnectTimer);
      p.disconnectTimer = null;
      recomputeVoiceConnState();
    } else if (st === 'disconnected') {
      recomputeVoiceConnState();
      clearTimeout(p.disconnectTimer);
      p.disconnectTimer = setTimeout(() => {
        if (pc.connectionState === 'disconnected') attemptPeerRecovery(id, p);
      }, 5000);
    } else if (st === 'failed') {
      clearTimeout(p.disconnectTimer);
      p.disconnectTimer = null;
      attemptPeerRecovery(id, p);
    } else {
      recomputeVoiceConnState();
    }
  };

  if (init) {
    pc.createOffer({ offerToReceiveAudio: true })
      .then(o => pc.setLocalDescription(o))
      .then(() => tx({ t: 'rtc', to: id, data: { sdp: pc.localDescription } }))
      .catch(e => console.warn('RTC offer error:', e));
  }
  recomputeVoiceConnState();
  return p;
}

function attemptPeerRecovery(id, p) {
  if (p.pc.restartIce && p.init) {
    voiceConnState = 'reconnecting';
    updateVoiceUI();
    try {
      p.pc.restartIce();
      p.pc.createOffer({ iceRestart: true })
        .then(o => p.pc.setLocalDescription(o))
        .then(() => tx({ t: 'rtc', to: id, data: { sdp: p.pc.localDescription } }))
        .catch(() => { closePeer(id); setTimeout(syncPeers, 1000); });
      return;
    } catch {}
  }
  closePeer(id);
  setTimeout(syncPeers, 1200);
}

async function onRtc(m) {
  try {
    let p = peers.get(m.from);
    if (m.data.sdp) {
      if (m.data.sdp.type === 'offer') {
        if (!p || p.pc.signalingState === 'closed') p = makePeer(m.from, false);
        await p.pc.setRemoteDescription(new RTCSessionDescription(m.data.sdp));
        const q = iceQueues.get(m.from) || [];
        while (q.length) { const c = q.shift(); await p.pc.addIceCandidate(new RTCIceCandidate(c)).catch(() => {}); }
        const ans = await p.pc.createAnswer();
        await p.pc.setLocalDescription(ans);
        tx({ t: 'rtc', to: m.from, data: { sdp: p.pc.localDescription } });
      } else if (m.data.sdp.type === 'answer' && p) {
        await p.pc.setRemoteDescription(new RTCSessionDescription(m.data.sdp));
        const q = iceQueues.get(m.from) || [];
        while (q.length) { const c = q.shift(); await p.pc.addIceCandidate(new RTCIceCandidate(c)).catch(() => {}); }
      }
    } else if (m.data.ice) {
      if (p && p.pc.remoteDescription) {
        await p.pc.addIceCandidate(new RTCIceCandidate(m.data.ice)).catch(() => {});
      } else {
        if (!iceQueues.has(m.from)) iceQueues.set(m.from, []);
        iceQueues.get(m.from).push(m.data.ice);
      }
    }
  } catch (e) { console.warn('RTC error:', e); }
}

function closePeer(id) {
  const p = peers.get(id);
  if (p) {
    clearTimeout(p.disconnectTimer);
    try { p.pc.close() } catch {};
    peers.delete(id);
  }
  iceQueues.delete(id);
  const a = document.getElementById('a-' + id);
  if (a) { a.srcObject = null; a.remove(); }
  talking.delete(id);
  document.querySelectorAll(`[data-id="${id}"]`).forEach(e => e.classList.remove('talk'));
  const m = meters.get(id);
  if (m) {
    try { m.source.disconnect() } catch {};
    try { m.analyser.disconnect() } catch {};
    meters.delete(id);
  }
  recomputeVoiceConnState();
}

function closeAllPeers() { [...peers.keys()].forEach(closePeer); }

// ═══ SPEAKING DETECTION ═══
const meters = new Map();
let lastSpoke = false;

function watch(st, id) {
  if (!id) return;
  if (meters.has(id)) {
    const old = meters.get(id);
    try { old.source.disconnect() } catch {};
    try { old.analyser.disconnect() } catch {};
    meters.delete(id);
  }
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const source = ac.createMediaStreamSource(st);
    const analyser = ac.createAnalyser();
    analyser.fftSize = 256;
    source.connect(analyser);
    meters.set(id, { source, analyser });
  } catch (e) { console.warn('Analyser error:', e); }
}

let speakingInterval = null;
function startSpeakingDetection() {
  clearInterval(speakingInterval);
  speakingInterval = setInterval(() => {
    const buf = new Uint8Array(128);
    meters.forEach((m, id) => {
      m.analyser.getByteTimeDomainData(buf);
      let maxVal = 0;
      for (let i = 0; i < buf.length; i++) {
        const v = Math.abs(buf[i] - 128);
        if (v > maxVal) maxVal = v;
      }
      const isSpeaking = maxVal > 14 && (id !== S?.you || micState === 'enabled');
      if (id === S?.you && isSpeaking !== lastSpoke) {
        lastSpoke = isSpeaking;
        tx({ t: 'speaking', v: isSpeaking });
      }
      if (isSpeaking !== talking.has(id)) {
        if (isSpeaking) talking.add(id); else talking.delete(id);
        document.querySelectorAll(`[data-id="${id}"]`).forEach(e => e.classList.toggle('talk', isSpeaking));
      }
    });
  }, 120);
}
startSpeakingDetection();

// ═══ CHAT ═══
let chatOpen = false, unreadChat = 0;

function toggleChat(force) {
  chatOpen = typeof force === 'boolean' ? force : !chatOpen;
  const p = $('#chat-panel');
  if (!p) return;
  p.classList.toggle('open', chatOpen);
  p.setAttribute('aria-hidden', String(!chatOpen));
  if (chatOpen) {
    unreadChat = 0;
    updateChatBadge();
    setTimeout(() => $('#chat-in')?.focus(), 100);
    const ms = $('#chat-msgs'); if (ms) ms.scrollTop = ms.scrollHeight;
  }
}

function updateChatBadge() {
  const b = $('#cbadge'); if (!b) return;
  if (unreadChat > 0) { b.textContent = unreadChat > 99 ? '99+' : unreadChat; b.style.display = 'inline-block' }
  else { b.style.display = 'none' }
}

function addChatMessage(msg) {
  const ms = $('#chat-msgs'); if (!ms) return;
  const empty = ms.querySelector('.chat-empty'); if (empty) empty.remove();
  const isMe = msg.id === S?.you;
  const d = new Date(msg.time || Date.now());
  const timeStr = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  const div = document.createElement('div');
  div.className = `cmsg ${isMe ? 'me' : ''}`;
  div.innerHTML = `<div class="cmsg-av">${avatar(msg.seed || 0)}</div><div class="cmsg-wrap"><div class="cmsg-meta">${esc(msg.name || 'Crew')} · ${timeStr}</div><div class="cmsg-txt">${esc(msg.msg)}</div></div>`;
  ms.appendChild(div);
  ms.scrollTop = ms.scrollHeight;
  if (!chatOpen) {
    unreadChat++;
    updateChatBadge();
    sfx.chat();
  }
}

function sendChat(text) {
  const t = (text || '').trim();
  if (!t) return;
  if (!S) { toast('Join a room first.'); return }
  tx({ t: 'chat', msg: t });
}

$('#chat-btn').onclick = () => { sfx.click(); toggleChat() };
$('#chat-close').onclick = () => { sfx.click(); toggleChat(false) };
$('#chat-form').onsubmit = e => {
  e.preventDefault();
  const inp = $('#chat-in'), v = inp.value;
  if (!v.trim()) return;
  sendChat(v);
  inp.value = '';
};
document.querySelectorAll('.chip').forEach(btn => {
  btn.onclick = () => { sfx.click(); sendChat(btn.textContent); };
});

// ═══ LIFECYCLE ═══
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) {
    if (ac && ac.state === 'suspended') ac.resume();
    if (!wsConnected && ws?.readyState !== WebSocket.OPEN) connect(false);
  }
});

window.addEventListener('pagehide', () => {
  stream?.getTracks().forEach(t => t.stop());
  closeAllPeers();
});

window.addEventListener('beforeunload', () => {
  stream?.getTracks().forEach(t => t.stop());
  closeAllPeers();
  clearInterval(timerInterval);
  clearInterval(speakingInterval);
});

render();
updateVoiceUI();
connect(true);
</script></body></html>

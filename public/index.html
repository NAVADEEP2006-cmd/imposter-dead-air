<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07080c">
<meta name="description" content="BLACKSITE // MOLE HUNT — A tense social-deduction game of cover identities and suspicion. 4–10 players. One mole. Expose them before exfil.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>BLACKSITE // MOLE HUNT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ═══ DESIGN TOKENS — BLACKSITE DOSSIER THEME ═══ */
:root {
  --bg: #07080c;
  --surface: #0d0f16;
  --surface2: #141824;
  --surface3: #1c2333;
  --border: #2a3348;
  --border-focus: #ffb300;
  --text: #f2ecdd;
  --text-dim: #a8a294;
  --text-faint: #5c5a52;

  --signal: #ffb300;
  --signal-glow: #ffb30044;
  --signal-bright: #ffc933;
  --danger: #ff2d3f;
  --danger-glow: #ff2d3f55;
  --danger-dim: #a31220;
  --success: #2dff8f;
  --success-dim: #0d9b52;
  --warn: #ffb300;
  --mole: #ff2d3f;
  --agent: #2dff8f;

  --mono: 'JetBrains Mono', 'Courier New', monospace;
  --sans: 'Space Grotesk', system-ui, -apple-system, sans-serif;
  --display: 'Barlow Condensed', 'Space Grotesk', system-ui, sans-serif;

  --safe-b: max(8px, env(safe-area-inset-bottom));
  --safe-t: max(8px, env(safe-area-inset-top));
  --radius: 8px;
  --radius-lg: 14px;

  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
}

/* ═══ RESET ═══ */
*, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; }
body {
  background-color: var(--bg);
  background-image:
    radial-gradient(ellipse at 50% -10%, rgba(255,179,0,0.10) 0%, transparent 55%),
    radial-gradient(ellipse at 50% 110%, rgba(255,45,63,0.07) 0%, transparent 55%),
    linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
  background-size: 100% 100%, 100% 100%, 36px 36px, 36px 36px;
  color: var(--text);
  font: 400 16px/1.5 var(--sans);
  overflow-x: hidden;
  overscroll-behavior: none;
  -webkit-overflow-scrolling: touch;
  -webkit-font-smoothing: antialiased;
}
/* Alarm vignette that intensifies with .alarm-1/2/3 on body */
#vignette { position: fixed; inset: 0; pointer-events: none; z-index: 2;
  box-shadow: inset 0 0 120px rgba(0,0,0,0.85); transition: box-shadow .5s; }
body.alarm-1 #vignette { box-shadow: inset 0 0 120px rgba(0,0,0,0.85), inset 0 0 60px rgba(255,179,0,0.12); }
body.alarm-2 #vignette { box-shadow: inset 0 0 140px rgba(0,0,0,0.9), inset 0 0 90px rgba(255,45,63,0.22); }
body.alarm-3 #vignette { box-shadow: inset 0 0 160px rgba(0,0,0,0.95), inset 0 0 120px rgba(255,45,63,0.4); animation: alarm-pulse 1s ease-in-out infinite; }
@keyframes alarm-pulse { 50% { box-shadow: inset 0 0 160px rgba(0,0,0,0.95), inset 0 0 160px rgba(255,45,63,0.55); } }

/* ═══ ATMOSPHERE: Scanlines + subtle noise ═══ */
body::before {
  content: "";
  position: fixed; inset: 0;
  background: repeating-linear-gradient(
    0deg,
    transparent 0px,
    transparent 2px,
    rgba(255,255,255,0.012) 2px,
    rgba(255,255,255,0.012) 4px
  );
  pointer-events: none;
  z-index: 9999;
}
body::after {
  content: "";
  position: fixed; inset: 0;
  background: radial-gradient(ellipse at 50% 0%, rgba(61,90,254,0.06) 0%, transparent 60%);
  pointer-events: none;
  z-index: 0;
}

/* ═══ LAYOUT ═══ */
#app {
  position: relative; z-index: 1;
  max-width: 520px;
  margin: 0 auto;
  padding: calc(var(--safe-t) + 8px) 16px calc(76px + var(--safe-b));
  min-height: 100%;
}

/* ═══ TYPOGRAPHY ═══ */
h1, h2, h3 { font-family: var(--mono); font-weight: 700; margin: 0; line-height: 1.1; letter-spacing: -0.02em; text-transform: uppercase; }
h1 { font-size: clamp(28px, 8vw, 44px); }
h2 { font-size: clamp(18px, 4.5vw, 24px); }
h3 { font-size: clamp(14px, 3.5vw, 17px); }

.phase-label {
  display: inline-flex; align-items: center; gap: 8px;
  font: 500 11px/1 var(--mono);
  color: var(--signal);
  text-transform: uppercase;
  letter-spacing: 0.12em;
  padding: 6px 12px;
  background: rgba(61,90,254,0.08);
  border: 1px solid rgba(61,90,254,0.15);
  border-radius: 4px;
  margin-bottom: 12px;
}
.phase-label::before {
  content: "";
  width: 6px; height: 6px;
  background: var(--signal);
  border-radius: 50%;
  animation: pulse-dot 2s ease-in-out infinite;
}
@keyframes pulse-dot {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.4; transform: scale(0.7); }
}

.dim { color: var(--text-dim); }
.faint { color: var(--text-faint); }
.danger-text { color: var(--danger); }
.signal-text { color: var(--signal); }
.success-text { color: var(--success); }
.mono { font-family: var(--mono); }

/* ═══ INTERACTIVE ═══ */
button, input, select { font: inherit; color: inherit; }
button {
  cursor: pointer; border: 0;
  min-height: 48px;
  touch-action: manipulation;
  appearance: none; -webkit-appearance: none;
}
:focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }

/* Primary button */
.btn {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  width: 100%;
  background: var(--signal);
  color: #fff;
  font: 600 15px/1 var(--sans);
  letter-spacing: 0.02em;
  padding: 14px 20px;
  border-radius: var(--radius);
  border: 1px solid transparent;
  min-height: 52px;
  transition: all 0.15s var(--ease-out);
  position: relative;
  overflow: hidden;
}
.btn::after {
  content: "";
  position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(255,255,255,0.08) 0%, transparent 50%);
  pointer-events: none;
}
.btn:hover { background: var(--signal-bright); transform: translateY(-1px); box-shadow: 0 4px 20px var(--signal-glow); }
.btn:active { transform: translateY(1px); }
.btn[disabled] { opacity: 0.35; pointer-events: none; filter: grayscale(0.3); }

.btn.alt {
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--text);
}
.btn.alt:hover { background: var(--surface3); border-color: var(--text-faint); }

.btn.danger {
  background: var(--danger);
  color: #fff;
}
.btn.danger:hover { background: #ff5270; box-shadow: 0 4px 20px var(--danger-glow); }

.btn.success {
  background: var(--success-dim);
  color: #fff;
}
.btn.success:hover { background: var(--success); }

.btn-row { display: flex; gap: 10px; margin-top: 14px; }
.btn-row > .btn { flex: 1; }

/* ═══ INPUTS ═══ */
input, select {
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px 14px;
  font-size: 16px;
  color: var(--text);
  transition: border-color 0.2s, box-shadow 0.2s;
  appearance: none; -webkit-appearance: none;
}
input:focus, select:focus {
  border-color: var(--signal);
  box-shadow: 0 0 0 3px var(--signal-glow);
  outline: none;
}
input::placeholder { color: var(--text-faint); }
label {
  display: block;
  font: 500 12px/1 var(--mono);
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-bottom: 6px;
}

/* ═══ PANELS ═══ */
.panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 16px;
  margin: 12px 0;
}
.panel.highlight {
  border-color: var(--signal);
  background: linear-gradient(135deg, rgba(61,90,254,0.06) 0%, var(--surface) 100%);
}
.panel.alert {
  border-color: var(--danger);
  background: linear-gradient(135deg, rgba(255,61,87,0.06) 0%, var(--surface) 100%);
}

/* ═══ ROOM CODE ═══ */
.room-code {
  font: 700 clamp(32px, 9vw, 42px)/1 var(--mono);
  letter-spacing: 0.2em;
  color: var(--signal);
  text-align: center;
  user-select: all;
  padding: 8px 0;
}

/* ═══ PLAYER SLOTS ═══ */
.slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; }
.slot {
  position: relative;
  text-align: center;
  padding: 10px 6px 8px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  font-size: 13px;
  overflow: hidden;
  word-break: break-word;
  transition: border-color 0.2s, box-shadow 0.2s, transform 0.2s;
  animation: slot-in 0.3s var(--ease-bounce);
}
@keyframes slot-in { from { transform: scale(0.8); opacity: 0; } }

.slot.empty {
  opacity: 0.25;
  border-style: dashed;
  min-height: 100px;
  display: grid;
  place-items: center;
  color: var(--text-faint);
  font-family: var(--mono);
  font-size: 11px;
}
.slot.me { border-color: var(--signal); box-shadow: 0 0 0 1px var(--signal-glow); }
.slot.off { opacity: 0.45; }
.slot b { display: block; margin-top: 4px; font-weight: 600; font-size: 13px; }
.tag {
  display: block;
  font: 500 10px/1.2 var(--mono);
  color: var(--text-faint);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin-top: 3px;
}
.tag.ok { color: var(--success); }
.host-crown { color: var(--warn); font-size: 11px; }

/* Talking states */
.slot.talk {
  border-color: var(--success);
  box-shadow: 0 0 12px rgba(0,230,118,0.2);
}
.slot.talk .av { animation: talk-bounce 0.35s ease-in-out infinite alternate; }
@keyframes talk-bounce { to { transform: translateY(-4px) scale(1.04); } }

/* Vote spotlight */
.slot.spot {
  border-color: var(--danger);
  box-shadow: 0 0 16px var(--danger-glow);
}
.slot.pick {
  border-color: var(--warn);
  box-shadow: 0 0 12px rgba(255,171,0,0.25);
  transform: scale(1.03);
}
.slot.dead .av { animation: none; transform: rotate(80deg) scale(0.8); filter: grayscale(1) brightness(0.6); }

/* ═══ AVATARS ═══ */
.av {
  width: 56px; height: 56px;
  display: block;
  margin: 0 auto;
  animation: float 4s ease-in-out infinite;
}
@keyframes float { 50% { transform: translateY(-2px); } }

/* Wave indicator */
.wave { display: inline-flex; gap: 2px; height: 10px; align-items: flex-end; }
.wave i { display: block; width: 2px; background: var(--signal); height: 3px; border-radius: 1px; }
.talk .wave i { animation: wave-pulse 0.4s infinite alternate; }
.wave i:nth-child(2) { animation-delay: 0.1s; }
.wave i:nth-child(3) { animation-delay: 0.2s; }
@keyframes wave-pulse { to { height: 10px; } }

/* ═══ REVEAL CARD ═══ */
.reveal-card {
  perspective: 1000px;
  margin: 24px auto;
  max-width: 360px;
}
.reveal-card > div {
  padding: 32px 20px;
  text-align: center;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  background: var(--surface);
  animation: card-flip 0.6s var(--ease-out) both;
  position: relative;
  overflow: hidden;
}
.reveal-card > div::before {
  content: "";
  position: absolute; inset: 0;
  background: linear-gradient(135deg, rgba(255,255,255,0.03) 0%, transparent 50%);
  pointer-events: none;
}
.reveal-card.crew > div {
  border-color: var(--signal);
  background: linear-gradient(180deg, rgba(61,90,254,0.08) 0%, var(--surface) 100%);
}
.reveal-card.imp > div {
  border-color: var(--danger);
  background: linear-gradient(180deg, rgba(255,61,87,0.1) 0%, rgba(30,10,12,0.9) 100%);
}
.secret-word {
  font: 700 clamp(24px, 6vw, 32px)/1.2 var(--mono);
  color: var(--signal);
  word-break: break-word;
  margin: 12px 0;
  letter-spacing: 0.04em;
}
.reveal-card.imp .secret-word { color: var(--danger); }
@keyframes card-flip { from { transform: rotateY(90deg); opacity: 0; } }

/* ═══ TIMER ═══ */
.timer {
  font: 700 clamp(20px, 5.5vw, 26px)/1 var(--mono);
  color: var(--text);
  transition: color 0.3s;
}
.timer.urgent { color: var(--danger); animation: timer-flash 0.5s ease-in-out infinite; }
@keyframes timer-flash { 50% { opacity: 0.6; } }

/* ═══ VOTE GRID ═══ */
.vote-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
}
.vote-grid button.slot {
  min-height: 110px;
  color: inherit;
  cursor: pointer;
  transition: all 0.15s var(--ease-out);
}
.vote-grid button.slot:hover:not([disabled]) {
  border-color: var(--warn);
  background: var(--surface2);
}

/* ═══ HEADER ROW ═══ */
.hdr {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 12px;
}
.hdr-left { display: flex; flex-direction: column; gap: 4px; }

/* ═══ TALLY ═══ */
.tally { font: 700 clamp(16px, 4.5vw, 20px)/1 var(--mono); color: var(--danger); }

/* ═══ HOME SCREEN ═══ */
.home-hero {
  text-align: center;
  padding: clamp(8vh, 12vh, 16vh) 0 24px;
  animation: hero-in 0.7s var(--ease-out);
}
.home-hero h1 {
  font-size: clamp(32px, 10vw, 52px);
  background: linear-gradient(135deg, var(--text) 0%, var(--text-dim) 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
}
.home-hero .subtitle {
  font: 500 clamp(12px, 3vw, 14px)/1.4 var(--mono);
  color: var(--danger);
  letter-spacing: 0.15em;
  text-transform: uppercase;
  margin-top: 4px;
}
.home-hero .tagline {
  color: var(--text-dim);
  font-size: 14px;
  margin-top: 12px;
  max-width: 300px;
  margin-left: auto; margin-right: auto;
}
@keyframes hero-in { from { opacity: 0; transform: translateY(12px); } }

.session-banner {
  text-align: center;
  border-color: var(--signal);
  animation: slot-in 0.3s var(--ease-bounce);
}

/* ═══ ROUND INTRO ═══ */
.intro-screen {
  text-align: center;
  padding: clamp(18vh, 25vh, 30vh) 0;
  animation: intro-in 0.6s var(--ease-out);
}
.intro-screen h1 {
  font-size: clamp(36px, 12vw, 56px);
  color: var(--text);
  letter-spacing: 0.06em;
}
.intro-screen .intro-sub {
  color: var(--danger);
  font: 500 14px/1.4 var(--mono);
  letter-spacing: 0.08em;
  margin-top: 8px;
  animation: intro-sub-in 0.6s 0.3s var(--ease-out) both;
}
@keyframes intro-in { from { opacity: 0; transform: scale(1.1); } }
@keyframes intro-sub-in { from { opacity: 0; transform: translateY(8px); } }

/* ═══ SPEAKER ═══ */
.speaker-block { text-align: center; }
.speaker-block .av { width: 80px; height: 80px; }
.speaker-block h3 { color: var(--signal); margin-top: 8px; }

/* ═══ CLUE LIST ═══ */
.clue-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg);
  padding: 8px 12px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  font-size: 13px;
}
.clue-item .clue-author {
  display: flex; align-items: center; gap: 6px;
}
.clue-item .clue-author .av { width: 24px; height: 24px; }
.clue-word {
  font-family: var(--mono);
  font-weight: 600;
  color: var(--signal);
}
.clue-word.timeout { color: var(--text-faint); font-style: italic; }

/* ═══ RESULT SCREEN ═══ */
.result-banner {
  text-align: center;
  padding: 28px 16px;
  border-radius: var(--radius-lg);
  margin-bottom: 16px;
  animation: result-in 0.5s var(--ease-out);
}
.result-banner.crew-win {
  background: linear-gradient(135deg, rgba(0,230,118,0.08), var(--surface));
  border: 1px solid rgba(0,230,118,0.3);
}
.result-banner.imp-win {
  background: linear-gradient(135deg, rgba(255,61,87,0.08), var(--surface));
  border: 1px solid rgba(255,61,87,0.3);
}
.result-banner h1 { margin-bottom: 8px; }
@keyframes result-in { from { opacity: 0; transform: scale(0.95); } }

.result-word {
  font: 700 clamp(22px, 6vw, 30px)/1.2 var(--mono);
  color: var(--signal);
  padding: 16px;
  text-align: center;
}

/* ═══ BOTTOM BAR ═══ */
.bar {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  z-index: 15;
  display: flex;
  gap: 8px;
  align-items: center;
  padding: 8px 14px var(--safe-b);
  background: rgba(9,9,15,0.92);
  border-top: 1px solid var(--border);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}
.bar button {
  width: auto; min-width: 44px; min-height: 44px;
  padding: 0 10px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  font-size: 18px;
  transition: background 0.15s, border-color 0.15s;
}
.bar button:hover { background: var(--surface3); }
.bar button.on {
  background: var(--signal);
  border-color: var(--signal);
  color: #fff;
}
.bar .st {
  flex: 1;
  font: 500 12px/1.3 var(--mono);
  color: var(--text-dim);
  letter-spacing: 0.02em;
}

/* ═══ TOAST ═══ */
.toast {
  position: fixed;
  top: calc(var(--safe-t) + 8px);
  left: 50%;
  transform: translateX(-50%);
  background: var(--text);
  color: var(--bg);
  padding: 10px 18px;
  border-radius: var(--radius);
  z-index: 200;
  max-width: 90vw;
  font: 600 13px/1.3 var(--sans);
  box-shadow: 0 8px 30px rgba(0,0,0,0.5);
  animation: toast-in 0.25s var(--ease-bounce);
}
@keyframes toast-in { from { transform: translateX(-50%) translateY(-12px); opacity: 0; } }

/* ═══ CONNECTION BANNER ═══ */
.conn-bar {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 300;
  text-align: center;
  padding: 6px 12px;
  font: 600 12px/1 var(--mono);
  background: var(--danger);
  color: #fff;
  letter-spacing: 0.04em;
  animation: toast-in 0.25s var(--ease-bounce);
}

/* ═══ CHAT DRAWER ═══ */
.cbadge {
  position: absolute; top: -4px; right: -4px;
  background: var(--danger);
  color: #fff;
  border-radius: 10px;
  padding: 2px 6px;
  font-size: 10px;
  font-weight: 700;
  line-height: 1;
  box-shadow: 0 0 8px var(--danger-glow);
  animation: slot-in 0.2s var(--ease-bounce);
}
.chat-drawer {
  position: fixed;
  left: 50%; bottom: 0;
  transform: translate(-50%, 105%);
  width: 100%; max-width: 520px;
  height: 72vh; max-height: 560px;
  background: rgba(9,9,15,0.96);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-top: 1px solid var(--signal);
  border-left: 1px solid var(--border);
  border-right: 1px solid var(--border);
  border-top-left-radius: var(--radius-lg);
  border-top-right-radius: var(--radius-lg);
  z-index: 50;
  display: flex; flex-direction: column;
  transition: transform 0.3s var(--ease-out), opacity 0.2s;
  box-shadow: 0 -12px 40px rgba(0,0,0,0.6);
  pointer-events: none;
  opacity: 0;
}
.chat-drawer.open { transform: translate(-50%, 0); pointer-events: auto; opacity: 1; }
.chat-hdr {
  display: flex; justify-content: space-between; align-items: center;
  padding: 12px 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  border-top-left-radius: var(--radius-lg);
  border-top-right-radius: var(--radius-lg);
}
.chat-hdr h3 { font-size: 13px; margin: 0; color: var(--signal); letter-spacing: 0.1em; }
.chat-hdr .live-dot {
  display: inline-block;
  width: 6px; height: 6px;
  background: var(--success);
  border-radius: 50%;
  margin-left: 8px;
  animation: pulse-dot 2s ease-in-out infinite;
  vertical-align: middle;
}
.chat-close {
  background: transparent;
  color: var(--text-dim);
  font-size: 20px; line-height: 1;
  border: 0; cursor: pointer;

    filter.Q.setValueAtTime(2.2, ctx.currentTime);

    const gain = ctx.createGain();

    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);

    noise.connect(filter).connect(gain).connect(ctx.destination);

  } catch {}
}

// ═══ CONNECTION ═══
function connect(first) {
  clearTimeout(connect.t);
  try {
    let targetHost = window.SERVER_HOST;
    if (!targetHost) {
      if (!location.host || location.protocol === 'file:') {
        targetHost = 'localhost:3000';
      } else if ((location.hostname === 'localhost' || location.hostname === '127.0.0.1') && location.port !== '3000') {
        targetHost = `${location.hostname}:3000`;
      } else {
        targetHost = location.host;
      }
    }
    const proto = (location.protocol === 'https:' && !targetHost.includes('localhost')) ? 'wss://' : 'ws://';
    ws = new WebSocket(proto + targetHost);

    ws.onopen = () => {
      retry = 0;
      wsConnected = true;
      hideConnBanner();
      if (me) tx({ t: 'resume', code: me.code, id: me.id, token: me.token });
      updateVoiceUI();
    };

    ws.onmessage = e => {
      let m;
      try { m = JSON.parse(e.data) } catch { return }
      if (m.t === 'pong') return;
      if (m.t === 'joined') {
        me = { code: m.code, id: m.id, token: m.token };
        try { localStorage.setItem('imp-session', JSON.stringify(me)) } catch {}
      } else if (m.t === 'state') {
        const prev = S; S = m.s; onState(prev);
      } else if (m.t === 'error') {
        toast(m.msg);
        if (/expired|not found/i.test(m.msg)) {
          me = null; S = null;
          try { localStorage.removeItem('imp-session') } catch {}
          render();
        }
      } else if (m.t === 'rtc') {
        onRtc(m);
      } else if (m.t === 'speaking') {
        if (m.v) talking.add(m.id); else talking.delete(m.id);
        document.querySelectorAll(`[data-id="${m.id}"]`).forEach(el => el.classList.toggle('talk', !!m.v));
      } else if (m.t === 'chat') {
        addChatMessage(m);
      } else if (m.t === 'chat_rejected') {
        toast('🚫 ' + (m.msg || 'Message blocked.'));
      } else if (m.t === 'clue_rejected') {
        toast('⚠️ ' + (m.msg || 'Clue rejected.'));
      }
    };

    ws.onclose = () => {
      wsConnected = false;
      if (S) showConnBanner('Connection lost — reconnecting…');
      const delay = Math.min(10000, 500 * Math.pow(1.5, retry++));
      connect.t = setTimeout(() => connect(false), delay);
    };

    ws.onerror = () => {};
  } catch (err) {
    console.warn('WebSocket init error:', err);
    wsConnected = false;
    const delay = Math.min(10000, 500 * Math.pow(1.5, retry++));
    connect.t = setTimeout(() => connect(false), delay);
  }
}

const tx = m => { if (ws && ws.readyState === 1) ws.send(JSON.stringify(m)); else toast('Connecting…') };
// Local suspicion board (client-only, never sent to server)
const susp = new Set();
try {
  const saved = JSON.parse(localStorage.getItem('mole-suspects') || '[]');
  if (Array.isArray(saved)) saved.forEach(id => susp.add(id));
} catch {}
function toggleSusp(id) {
  if (susp.has(id)) susp.delete(id); else susp.add(id);
  try { localStorage.setItem('mole-suspects', JSON.stringify([...susp].slice(0, 10))) } catch {}
  sfx.click();
  render();
}
// Mission event feed (client-side narrative log)
const feedLog = [];
function logFeed(text, cls) {
  feedLog.push({ text, cls: cls || '', time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) });
  while (feedLog.length > 6) feedLog.shift();
}
function feedHTML() {
  if (!feedLog.length) return '';
  return `<div class="panel"><label style="margin-bottom:8px">Mission log</label><div class="feed">${feedLog.map(e => `<div class="${e.cls}">[${e.time}] ${esc(e.text)}</div>`).join('')}</div></div>`;
}
function setAlarm(level) {
  document.body.classList.remove('alarm-1', 'alarm-2', 'alarm-3');
  if (level > 0) document.body.classList.add('alarm-' + Math.min(3, level));
}

// Keep-alive heartbeat
setInterval(() => {
  if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ t: 'ping' }));
}, 25000);

function onState(prev) {
  hideConnBanner();
  if (S && typeof S.phase === 'string' && S.phase.indexOf('salvage-') === 0) {
    if (!prev || prev.phase !== S.phase) {
      if (S.phase === 'salvage-staging') { logFeed('Haul staged. Host opens the window.'); sfx.join(); }
      else if (S.phase === 'salvage-run') { logFeed('Haul window open. Cells to the depot.'); sfx.turn(); }
      else if (S.phase === 'salvage-extract') { logFeed('DOCK WINDOW: get bodies and loot out.', 'red'); sfx.alarm(); setAlarm(2); }
      else if (S.phase === 'salvage-debrief') {
        const w = S.salvage && S.salvage.result && S.salvage.result.win;
        logFeed(w ? 'Haul closed. Payout split.' : 'Haul closed in the dark.', w ? 'green' : 'red');
        setAlarm(0);
        if (w) sfx.win(); else sfx.lose();
      }
    }
    if (S.notice && (!prev || prev.notice !== S.notice)) toast(S.notice);
    render();
    syncPeers();
    return;
  }
  // Mission log narrative
  if (!prev || prev.phase !== S.phase) {
    if (S.phase === 'reveal') logFeed('Cover identities issued. Trust no one.');
    else if (S.phase === 'clues') logFeed('Dead-drop window open. Transmit one word each.');
    else if (S.phase === 'discussion') logFeed('Interrogation started. Watch for slips.', 'red');
    else if (S.phase === 'vote') { logFeed('Exposure vote live. Name the mole.', 'red'); setAlarm(2); }
    else if (S.phase === 'defense') logFeed('Vote deadlocked. Suspects may speak.', 'red');
    else if (S.phase === 'revote') logFeed('Second ballot. One mistake ends it.', 'red');
    else if (S.phase === 'guess') logFeed('Compromised asset is guessing the cipher.', 'red');
    else if (S.phase === 'result') {
      const cw = S.result && S.result.winner === 'crew';
      logFeed(cw ? 'Mole exposed. Site secure.' : 'Mole exfiltrated. Site burned.', cw ? 'green' : 'red');
      setAlarm(cw ? 0 : 3);
    } else if (S.phase === 'lobby') setAlarm(0);
  }
  if (prev && S.game && prev.game && S.game.clues.length > prev.game.clues.length) {
    const c = S.game.clues[S.game.clues.length - 1];
    logFeed(`${P(c.pid).name} dropped a clue.`);
  }
  // Phase-specific audio
  if (!prev || prev.phase !== S.phase) {
    const phase = S.phase;
    if (phase === 'reveal') sfx.reveal();
    else if (phase === 'vote' || phase === 'voting') { sfx.alarm(); setAlarm(2); }
    else if (phase === 'revote' || phase === 'tie_revote') sfx.alarm();
    else if (phase === 'verdict') sfx.verdict();
    else if (phase === 'result' || phase === 'results') {
      sfx.stamp();
      const isWin = S.result && ((S.result.winner === 'impostor') === (S.result.impostor === S.you));
      setTimeout(() => { isWin ? sfx.win() : sfx.lose(); }, 250);
    } else sfx.click();
  }
  if (prev && S.players.length > prev.players.length) sfx.join();
  if (prev && S.game && S.game.speaker === S.you && prev.game?.speaker !== S.you) sfx.turn();
  if (S.phase !== 'vote' && S.phase !== 'voting' && S.phase !== 'revote' && S.phase !== 'tie_revote') sel = null;
  if (S.notice && (!prev || prev.notice !== S.notice)) toast(S.notice);
  if (S.phase === 'reveal' && introShown !== S.round) { introShown = S.round; intro() } else render();
  syncPeers();
}

    roleHint = `<p class="dim text-center" style="font-size:12px;color:var(--danger)">You are the mole. Deflect. Deceive. Survive exfil.</p>`;

// ═══ EVENT BINDING ═══
function bind() {
  const on = (s, f) => { const e = $(s); if (e) e.onclick = () => { sfx.click(); f(e) } };
  on('#lv', () => { tx({ t: 'leave' }); try { localStorage.removeItem('imp-session') } catch {} me = null; S = null; closeAllPeers(); render() });
  on('#cp', () => {
    const text = S.code;
    if (navigator.share) { navigator.share({ title: 'Infiltrate my blacksite!', text: `Infiltrate site: ${text}` }).catch(() => {}) }
    else if (navigator.clipboard) { navigator.clipboard.writeText(text).then(() => toast('Access code copied!'), () => toast('Press and hold the code to copy.')) }
    else { toast('Press and hold the code to copy.') }
  });
  on('#rd', () => tx({ t: 'ready', v: !P(S.you).ready }));
  on('#go', () => tx({ t: 'start' }));
  on('#nx', () => tx({ t: 'next' }));
  on('#ag', () => tx({ t: 'again' }));
  const cat = $('#cat'); if (cat) cat.onchange = () => tx({ t: 'category', v: cat.value });
  const mc = $('#mode-classic'); if (mc) mc.onclick = () => { sfx.click(); tx({ t: 'mode', v: 'classic' }); };
  const ms = $('#mode-salvage'); if (ms) ms.onclick = () => { sfx.click(); tx({ t: 'mode', v: 'salvage' }); };

  // Clue submission
  const clueSub = $('#clue-sub');
  if (clueSub) {
    clueSub.onclick = () => {
      const inp = $('#clue-in');
      const val = (inp?.value || '').trim();
      if (!val) return toast('Type a clue first.');
      tx({ t: 'clue', word: val, roundId: S?.roundId });
    };
  }
  const clueIn = $('#clue-in');
  if (clueIn) {
    clueIn.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); $('#clue-sub')?.click() } };
  }

  // Discussion ready
  on('#rd-disc', () => tx({ t: 'ready_discuss', v: !P(S.you).discussReady, roundId: S?.roundId }));

  // Voting
  document.querySelectorAll('[data-v]').forEach(b => b.onclick = () => { if (!S.game.voted.includes(S.you)) { sel = b.dataset.v; sfx.select(); render() } });
  on('#cast', () => { tx({ t: 'vote', target: sel, roundId: S?.roundId }); sfx.vote() });

  // Revoting
  document.querySelectorAll('[data-rv]').forEach(b => b.onclick = () => { if (!S.game.revoted.includes(S.you)) { sel = b.dataset.rv; sfx.select(); render() } });
  on('#cast-revote', () => { tx({ t: 'revote', target: sel, roundId: S?.roundId }); sfx.vote() });

  // Local suspicion board (click FLAG without triggering vote select)
  document.querySelectorAll('[data-susp]').forEach(b => b.onclick = e => { e.stopPropagation(); toggleSusp(b.dataset.susp) });

  // Final guess
  const guessSub = $('#guess-sub');
  if (guessSub) {
    guessSub.onclick = () => {
      const inp = $('#guess-in');
      const val = (inp?.value || '').trim();
      if (!val) return toast('Type your guess first.');
      tx({ t: 'guess', word: val, roundId: S?.roundId });
    };
  }
  const guessIn = $('#guess-in');
  if (guessIn) {
    guessIn.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); $('#guess-sub')?.click() } };
  }
}

// ═══ TIMER (with alarm escalation) ═══
let timerInterval = null;
function startTimer() {
  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    const t = $('#tm');
    if (t && S?.deadline) {
      const left = Math.max(0, Math.ceil((S.deadline - Date.now()) / 1000));
      t.textContent = left + 's';
      t.classList.toggle('urgent', left <= 10);
      if (S.phase === 'vote' || S.phase === 'revote' || S.phase === 'guess' || S.phase === 'defense') {
        if (left <= 5) setAlarm(3);
        else if (left <= 10) setAlarm(2);
      }
    }
  }, 250);
}
startTimer();

// ═══ VOICE (WebRTC mesh) ═══
const peers = new Map();
const iceQueues = new Map();
let stream = null;

let micState = 'disabled';
let voiceConnState = 'none';

function recomputeVoiceConnState() {
  if (!stream || !peers.size) {
    voiceConnState = 'none';
    updateVoiceUI();
    return;
  }
  const states = [...peers.values()].map(p => p.pc.connectionState);
  if (states.some(s => s === 'connected')) voiceConnState = 'connected';
  else if (states.some(s => s === 'connecting' || s === 'new')) voiceConnState = 'connecting';
  else if (states.some(s => s === 'disconnected')) voiceConnState = 'degraded';
  else if (states.every(s => s === 'failed' || s === 'closed')) voiceConnState = 'failed';
  else voiceConnState = 'connecting';
  updateVoiceUI();
}

function updateVoiceUI() {
  const el = $('#vst'), btn = $('#mic');
  if (!el || !btn) return;

  btn.classList.toggle('on', micState === 'enabled');
  btn.textContent = micState === 'enabled' ? 'MIC' : (micState === 'muted' ? 'MUT' : 'MIC');

  let text = '';
  if (micState === 'denied') text = 'X Mic denied';
  else if (micState === 'disabled') text = 'Radio off — tap MIC';
  else {
    const ml = micState === 'enabled' ? 'MIC LIVE' : 'MIC MUTED';
    if (voiceConnState === 'none') text = `RADIO ${ml}`;
    else if (voiceConnState === 'connecting') text = `LINKING… ${ml}`;
    else if (voiceConnState === 'connected') text = micState === 'enabled' ? 'LINE SECURE' : 'MUTED · LINKED';
    else if (voiceConnState === 'degraded') text = `SIGNAL WEAK · ${ml}`;
    else if (voiceConnState === 'reconnecting') text = `RE-LINKING…`;
    else if (voiceConnState === 'failed') text = HAS_TURN ? 'LINK FAILED' : 'LINK FAILED (RELAY NEEDED)';
  }
  el.textContent = text;
}

$('#mic').onclick = async () => {
  unlockAudio();
  if (!stream) {
    if (!window.isSecureContext) {
      micState = 'denied';
      toast('Voice requires HTTPS or localhost.');
      return updateVoiceUI();
    }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      micState = 'denied';
      toast('Browser does not support microphone.');
      return updateVoiceUI();
    }
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
      });
      micState = 'enabled';
      watch(stream, S?.you);
      peers.forEach(p => {
        if (p.tx?.sender && stream.getAudioTracks().length) {
          p.tx.sender.replaceTrack(stream.getAudioTracks()[0]);
        }
      });
      syncPeers();
      toast('Microphone connected');
    } catch (e) {
      micState = 'denied';
      if (e.name === 'NotAllowedError' || e.name === 'PermissionDeniedError') toast('Mic permission denied.');
      else if (e.name === 'NotFoundError') toast('No microphone found.');
      else toast('Could not access microphone.');
    }
  } else {
    const nextState = micState === 'enabled' ? 'muted' : 'enabled';
    micState = nextState;
    stream.getAudioTracks().forEach(t => { t.enabled = (nextState === 'enabled'); });
    if (nextState === 'muted') {
      lastSpoke = false;
      tx({ t: 'speaking', v: false });
      talking.delete(S?.you);
      document.querySelectorAll(`[data-id="${S?.you}"]`).forEach(e => e.classList.remove('talk'));
    }
  }
  updateVoiceUI();
};

function syncPeers() {
  if (!S) return;
  const ids = S.players.filter(p => p.connected && p.id !== S.you).map(p => p.id);
  [...peers.keys()].filter(id => !ids.includes(id)).forEach(closePeer);
  ids.forEach(id => {
    if (!peers.has(id) && S.you < id) makePeer(id, true);
  });
  recomputeVoiceConnState();
}

function makePeer(id, init) {
  const pc = new RTCPeerConnection({ iceServers: ICE_SERVERS });
  const t = pc.addTransceiver('audio', { direction: 'sendrecv' });
  if (stream && stream.getAudioTracks().length) {
    t.sender.replaceTrack(stream.getAudioTracks()[0]);
  }
  const p = { pc, tx: t, init, disconnectTimer: null };
  peers.set(id, p);

  pc.onicecandidate = e => {
    if (e.candidate) tx({ t: 'rtc', to: id, data: { ice: e.candidate } });
  };

  pc.ontrack = e => {
    let a = document.getElementById('a-' + id);
    if (!a) {
      a = document.createElement('audio');
      a.id = 'a-' + id;
      a.autoplay = true;
      a.playsInline = true;
      document.body.append(a);
    }
    a.srcObject = e.streams[0];
    a.play().catch(err => console.warn('Autoplay prevented:', id, err));
    watch(e.streams[0], id);
  };

  pc.onconnectionstatechange = () => {
    const st = pc.connectionState;
    if (st === 'connected') {
      clearTimeout(p.disconnectTimer);
      p.disconnectTimer = null;
      recomputeVoiceConnState();
    } else if (st === 'disconnected') {
      recomputeVoiceConnState();
      clearTimeout(p.disconnectTimer);
      p.disconnectTimer = setTimeout(() => {
        if (pc.connectionState === 'disconnected') attemptPeerRecovery(id, p);
      }, 5000);
    } else if (st === 'failed') {
      clearTimeout(p.disconnectTimer);
      p.disconnectTimer = null;
      attemptPeerRecovery(id, p);
    } else {
      recomputeVoiceConnState();
    }
  };

  if (init) {
    pc.createOffer({ offerToReceiveAudio: true })
      .then(o => pc.setLocalDescription(o))
      .then(() => tx({ t: 'rtc', to: id, data: { sdp: pc.localDescription } }))
      .catch(e => console.warn('RTC offer error:', e));
  }
  recomputeVoiceConnState();
  return p;
}

function attemptPeerRecovery(id, p) {
  if (p.pc.restartIce && p.init) {
    voiceConnState = 'reconnecting';
    updateVoiceUI();
    try {
      p.pc.restartIce();
      p.pc.createOffer({ iceRestart: true })
        .then(o => p.pc.setLocalDescription(o))
        .then(() => tx({ t: 'rtc', to: id, data: { sdp: p.pc.localDescription } }))
        .catch(() => { closePeer(id); setTimeout(syncPeers, 1000); });
      return;
    } catch {}
  }
  closePeer(id);
  setTimeout(syncPeers, 1200);
}

async function onRtc(m) {
  try {
    let p = peers.get(m.from);
    if (m.data.sdp) {
      if (m.data.sdp.type === 'offer') {
        if (!p || p.pc.signalingState === 'closed') p = makePeer(m.from, false);
        await p.pc.setRemoteDescription(new RTCSessionDescription(m.data.sdp));
        const q = iceQueues.get(m.from) || [];
        while (q.length) { const c = q.shift(); await p.pc.addIceCandidate(new RTCIceCandidate(c)).catch(() => {}); }
        const ans = await p.pc.createAnswer();
        await p.pc.setLocalDescription(ans);
        tx({ t: 'rtc', to: m.from, data: { sdp: p.pc.localDescription } });
      } else if (m.data.sdp.type === 'answer' && p) {
        await p.pc.setRemoteDescription(new RTCSessionDescription(m.data.sdp));
        const q = iceQueues.get(m.from) || [];
        while (q.length) { const c = q.shift(); await p.pc.addIceCandidate(new RTCIceCandidate(c)).catch(() => {}); }
      }
    } else if (m.data.ice) {
      if (p && p.pc.remoteDescription) {
        await p.pc.addIceCandidate(new RTCIceCandidate(m.data.ice)).catch(() => {});
      } else {
        if (!iceQueues.has(m.from)) iceQueues.set(m.from, []);
        iceQueues.get(m.from).push(m.data.ice);
      }
    }
  } catch (e) { console.warn('RTC error:', e); }
}

function closePeer(id) {
  const p = peers.get(id);
  if (p) {
    clearTimeout(p.disconnectTimer);
    try { p.pc.close() } catch {};
    peers.delete(id);
  }
  iceQueues.delete(id);
  const a = document.getElementById('a-' + id);
  if (a) { a.srcObject = null; a.remove(); }
  talking.delete(id);
  document.querySelectorAll(`[data-id="${id}"]`).forEach(e => e.classList.remove('talk'));
  const m = meters.get(id);
  if (m) {
    try { m.source.disconnect() } catch {};
    try { m.analyser.disconnect() } catch {};
    meters.delete(id);
  }
  recomputeVoiceConnState();
}

function closeAllPeers() { [...peers.keys()].forEach(closePeer); }

// ═══ SPEAKING DETECTION ═══
const meters = new Map();
let lastSpoke = false;

function watch(st, id) {
  if (!id) return;
  if (meters.has(id)) {
    const old = meters.get(id);
    try { old.source.disconnect() } catch {};
    try { old.analyser.disconnect() } catch {};
    meters.delete(id);
  }
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const source = ac.createMediaStreamSource(st);
    const analyser = ac.createAnalyser();
    analyser.fftSize = 256;
    source.connect(analyser);
    meters.set(id, { source, analyser });
  } catch (e) { console.warn('Analyser error:', e); }
}

let speakingInterval = null;
function startSpeakingDetection() {
  clearInterval(speakingInterval);
  speakingInterval = setInterval(() => {
    const buf = new Uint8Array(128);
    meters.forEach((m, id) => {
      m.analyser.getByteTimeDomainData(buf);
      let maxVal = 0;
      for (let i = 0; i < buf.length; i++) {
        const v = Math.abs(buf[i] - 128);
        if (v > maxVal) maxVal = v;
      }
      const isSpeaking = maxVal > 14 && (id !== S?.you || micState === 'enabled');
      if (id === S?.you && isSpeaking !== lastSpoke) {
        lastSpoke = isSpeaking;
        tx({ t: 'speaking', v: isSpeaking });
      }
      if (isSpeaking !== talking.has(id)) {
        if (isSpeaking) talking.add(id); else talking.delete(id);
        document.querySelectorAll(`[data-id="${id}"]`).forEach(e => e.classList.toggle('talk', isSpeaking));
      }
    });
  }, 120);
}
startSpeakingDetection();

// ═══ CHAT ═══
let chatOpen = false, unreadChat = 0;

function toggleChat(force) {
  chatOpen = typeof force === 'boolean' ? force : !chatOpen;
  const p = $('#chat-panel');
  if (!p) return;
  p.classList.toggle('open', chatOpen);
  p.setAttribute('aria-hidden', String(!chatOpen));
  if (chatOpen) {
    unreadChat = 0;
    updateChatBadge();
    setTimeout(() => $('#chat-in')?.focus(), 100);
    const ms = $('#chat-msgs'); if (ms) ms.scrollTop = ms.scrollHeight;
  }
}

function updateChatBadge() {
  const b = $('#cbadge'); if (!b) return;
  if (unreadChat > 0) { b.textContent = unreadChat > 99 ? '99+' : unreadChat; b.style.display = 'inline-block' }
  else { b.style.display = 'none' }
}

function addChatMessage(msg) {
  const ms = $('#chat-msgs'); if (!ms) return;
  const empty = ms.querySelector('.chat-empty'); if (empty) empty.remove();
  const isMe = msg.id === S?.you;
  const d = new Date(msg.time || Date.now());
  const timeStr = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  const div = document.createElement('div');
  div.className = `cmsg ${isMe ? 'me' : ''}`;
  div.innerHTML = `<div class="cmsg-av">${avatar(msg.seed || 0)}</div><div class="cmsg-wrap"><div class="cmsg-meta">${esc(msg.name || 'Crew')} · ${timeStr}</div><div class="cmsg-txt">${esc(msg.msg)}</div></div>`;
  ms.appendChild(div);
  ms.scrollTop = ms.scrollHeight;
  if (!chatOpen) {
    unreadChat++;
    updateChatBadge();
    sfx.chat();
  }
}

function sendChat(text) {
  const t = (text || '').trim();
  if (!t) return;
  if (!S) { toast('Join a room first.'); return }
  tx({ t: 'chat', msg: t });
}

$('#chat-btn').onclick = () => { sfx.click(); toggleChat() };
$('#chat-close').onclick = () => { sfx.click(); toggleChat(false) };
$('#chat-form').onsubmit = e => {
  e.preventDefault();
  const inp = $('#chat-in'), v = inp.value;
  if (!v.trim()) return;
  sendChat(v);
  inp.value = '';
};
document.querySelectorAll('.chip').forEach(btn => {
  btn.onclick = () => { sfx.click(); sendChat(btn.textContent); };
});

// ═══ SALVAGE CLIENT (additive) ═══
const svView = { lastTx: 0, interp: new Map() };
function svState() { return S && S.salvage ? S.salvage : null; }
function svHookText(h) {
  if (h === 'core') return 'PERSONAL — Extract with the UNSTABLE CORE.';
  if (h === 'rescue') return 'PERSONAL — Patch up a downed crewmate.';
  return 'PERSONAL — Bank a GLOW RELIC.';
}
function svTimeLeft() { if (!S || !S.deadline) return null; return Math.max(0, Math.ceil((S.deadline - Date.now()) / 1000)); }
function svDist(a, b) { const dx = a.x - b.x, dy = a.y - b.y; return Math.sqrt(dx * dx + dy * dy); }
function svScreen() {
  const sv = svState();
  const host = S.hostId === S.you;
  if (!sv) return '<div class="panel alert"><h3>Haul syncing…</h3></div>';
  if (sv.phase === 'debrief') return svDebrief(sv, host);
  const carry = Array.isArray(S.carry) ? S.carry : [];
  const myPart = sv.parts ? sv.parts.find(p => p.id === S.you) : null;
  const left = svTimeLeft();
  const title = sv.phase === 'staging' ? 'STAGING' : sv.phase === 'run' ? 'HAUL ACTIVE' : 'EXTRACTION';
  return '<div class="sv-wrap"><div class="sv-top"><div class="sv-obj"><b>STATION POWER</b><div class="big">'
    + (sv.mission || 0) + ' / ' + (sv.need || 2) + ' CELLS</div><div class="dim" style="font:600 11px/1.4 var(--mono)">'
    + (sv.phase === 'extract' ? 'DOCK WINDOW OPEN — GET OUT' : sv.phase === 'staging' ? 'STAGE — HOST OPENS THE HAUL' : 'BANK CELLS AT THE DEPOT')
    + '</div></div><div class="sv-timer"><b>' + title + '</b><div class="t" id="sv-clock">' + (left === null ? '--' : left + 's') + '</div></div></div>'
    + '<canvas id="sv-map" width="1000" height="620"></canvas>'
    + '<div class="sv-hud"><div class="sv-carry"><b>CARRY</b> — ' + (carry.length ? carry.map(c => esc(c.name)).join(' · ') : 'empty hands') + (myPart ? ' — ' + (myPart.slots || 0) + '/3 slots' : '') + (myPart && myPart.down ? ' — DOWN' : '') + '</div></div>'
    + (S.hook ? '<div class="sv-hook">' + esc(svHookText(S.hook)) + '</div>' : '')
    + '<div class="sv-act">' + (sv.phase === 'staging' && host ? '<button class="btn" id="sv-open">OPEN HAUL</button>' : '')
    + '<button class="btn alt" id="sv-grab">GRAB</button><button class="btn alt" id="sv-bank">BANK</button>'
    + '<button class="btn alt" id="sv-patch">PATCH</button><button class="btn alt" id="sv-drop">DROP</button></div>'
    + '<div class="feed sv-feed">' + feedHTML() + '</div>'
    + '<div class="row" style="margin-top:10px"><button class="btn alt" id="lv2">Leave haul</button></div></div>';
}
function svDebrief(sv, host) {
  const r = sv.result;
  if (!r) return '<div class="panel"><h3>Haul over</h3></div>';
  const nm = id => (P(id) && P(id).name) || 'Crew';
  let rows = '';
  for (const p of (r.parts || [])) rows += '<p class="dim" style="font-size:13px;margin:4px 0"><b style="color:var(--text)">' + esc(p.name || nm(p.id)) + '</b> — mission ' + p.mission + ' · loot ' + p.loot + ' · rescues ' + p.rescues + (p.out ? ' · OUT' : '') + (p.hookDone ? ' · PERSONAL OK' : '') + '</p>';
  return '<div class="sv-wrap sv-debrief"><div class="phase-label">' + (r.win ? 'MISSION COMPLETE' : 'MISSION FAILED') + '</div><h1>$' + (r.total || 0) + ' TEAM HAUL</h1>'
    + '<p class="dim">' + r.mission + '/' + r.need + ' cells · ' + r.out.length + ' extracted</p><div class="panel" style="text-align:left">' + rows
    + '<p class="dim" style="font-size:12px">MVP: ' + esc(nm(r.mvp)) + ' · Greediest: ' + esc(nm(r.greediest)) + '</p></div>'
    + (host ? '<button class="btn" id="sv-again">PLAY AGAIN</button><div class="gap-sm"></div><button class="btn alt" id="sv-quit">BACK TO LOBBY</button>' : '<p class="dim">Waiting for host…</p><div class="gap-sm"></div><button class="btn alt" id="sv-quit">Leave</button>') + '</div>';
}
function svGrabNearest() {
  const sv = svState();
  if (!sv || !sv.parts) return toast('No haul.');
  const me = sv.parts.filter(p => p.id === S.you)[0];
  if (!me) return;
  let best = null, bd = 1e9;
  for (const it of (sv.items || [])) { const d = svDist(me, it); if (d < bd) { bd = d; best = it; } }
  if (!best) return toast('Nothing nearby.');
  if (bd > 110) return toast('Get closer to grab.');
  tx({ t: 'grab', item: best.id, haulId: S.roundId, roundId: S.roundId });
}
function svPatchNearest() {
  const sv = svState();
  if (!sv || !sv.parts) return;
  const me = sv.parts.filter(p => p.id === S.you)[0];
  if (!me) return;
  let best = null, bd = 1e9;
  for (const p of sv.parts) { if (p.id === S.you || !p.down) continue; const d = svDist(me, p); if (d < bd) { bd = d; best = p; } }
  if (!best) return toast('No downed crew nearby.');
  if (bd > 120) return toast('Get next to them to patch.');
  tx({ t: 'patch', target: best.id, haulId: S.roundId, roundId: S.roundId });
}
function svBind() {
  const on = (s, f) => { const e = $(s); if (e) e.onclick = () => { sfx.click(); f(e); }; };
  on('#lv2', () => { tx({ t: 'leave' }); try { localStorage.removeItem('imp-session'); } catch (e) {} me = null; S = null; render(); });
  on('#sv-quit', () => tx({ t: 'quit_haul' }));
  on('#sv-again', () => tx({ t: 'again_haul' }));
  on('#sv-open', () => tx({ t: 'haul_open' }));
  on('#sv-grab', svGrabNearest);
  on('#sv-bank', () => tx({ t: 'bank', haulId: S.roundId, roundId: S.roundId }));
  on('#sv-patch', svPatchNearest);
  on('#sv-drop', () => {
    const c = Array.isArray(S.carry) && S.carry[0] ? S.carry[0].id : null;
    if (!c) return toast('Empty hands.');
    tx({ t: 'drop', item: c, haulId: S.roundId, roundId: S.roundId });
  });
  const cv = $('#sv-map');
  if (cv) {
    let held = false;
    const wpos = e => {
      const r = cv.getBoundingClientRect();
      const cx = e.clientX !== undefined ? e.clientX : (e.touches && e.touches[0] ? e.touches[0].clientX : 0);
      const cy = e.clientY !== undefined ? e.clientY : (e.touches && e.touches[0] ? e.touches[0].clientY : 0);
      return { x: (cx - r.left) / r.width * 1000, y: (cy - r.top) / r.height * 620 };
    };
    const mv = e => {
      const w = wpos(e);
      const now = Date.now();
      if (now - svView.lastTx < 120) return;
      svView.lastTx = now;
      tx({ t: 'move', x: Math.round(w.x), y: Math.round(w.y), haulId: S.roundId, roundId: S.roundId });
    };
    cv.onpointerdown = e => { held = true; if (cv.setPointerCapture && e.pointerId !== undefined) { try { cv.setPointerCapture(e.pointerId); } catch (x) {} } mv(e); };
    cv.onpointermove = e => { if (held) mv(e); };
    cv.onpointerup = () => { held = false; };
  }
  window.onkeydown = e => {
    if (!S || String(S.phase).indexOf('salvage-') !== 0) { window.onkeydown = null; return; }
    const sv = svState();
    if (!sv || sv.phase === 'debrief' || !sv.parts) return;
    const mp = sv.parts.filter(p => p.id === S.you)[0];
    if (!mp) return;
    const step = e.shiftKey ? 90 : 55;
    let dx = 0, dy = 0;
    if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') dy = -step;
    else if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') dy = step;
    else if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') dx = -step;
    else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') dx = step;
    else if (e.key === 'e' || e.key === 'E') { svGrabNearest(); return; }
    else if (e.key === 'q' || e.key === 'Q') { svPatchNearest(); return; }
    else return;
    e.preventDefault();
    tx({ t: 'move', x: Math.round(mp.x + dx), y: Math.round(mp.y + dy), haulId: S.roundId, roundId: S.roundId });
  };
}
function svDraw() {
  const cv = $('#sv-map');
  const sv = svState();
  if (!cv || !sv) return;
  const ctx = cv.getContext('2d');
  const W = 1000, H = 620, now = Date.now();
  for (const p of (sv.parts || [])) {
    const k = svView.interp.get(p.id) || { x: p.x, y: p.y };
    svView.interp.set(p.id, { x: k.x + (p.x - k.x) * 0.3, y: k.y + (p.y - k.y) * 0.3 });
  }
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#0a0f0c'; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = 'rgba(126,226,168,0.08)'; ctx.lineWidth = 1;
  for (let x = 0; x < W; x += 50) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
  for (let y = 0; y < H; y += 50) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
  const depot = sv.depot || { x: 90, y: 300, r: 90 };
  const dock = sv.dock || { x: 910, y: 90, r: 95 };
  ctx.lineWidth = 3; ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(126,226,168,0.10)'; ctx.strokeStyle = '#7ee2a8';
  ctx.beginPath(); ctx.arc(depot.x, depot.y, depot.r, 0, 7); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#e9f5ec'; ctx.font = '700 20px monospace'; ctx.fillText('DEPOT', depot.x, depot.y + 7);
  const pulse = sv.phase === 'extract' ? (0.5 + 0.5 * Math.sin(now / 180)) : 0.2;
  ctx.fillStyle = 'rgba(255,200,80,' + (0.15 + pulse * 0.25).toFixed(2) + ')'; ctx.strokeStyle = '#ffcf5a';
  ctx.beginPath(); ctx.arc(dock.x, dock.y, dock.r, 0, 7); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.fillText('DOCK', dock.x, dock.y + 7);
  for (const h of (sv.hazards || [])) {
    ctx.fillStyle = h.active ? 'rgba(255,60,70,0.22)' : 'rgba(255,200,80,0.10)';
    ctx.strokeStyle = h.active ? '#ff3c4a' : '#8a7a3a';
    ctx.beginPath(); ctx.arc(h.x, h.y, h.r, 0, 7); ctx.fill(); ctx.stroke();
  }
  for (const it of (sv.items || [])) {
    const col = it.kind === 'cell' ? '#7ee2a8' : it.kind === 'medkit' ? '#7ec8ff' : it.kind === 'core' ? '#ff7a3c' : '#d9a7ff';
    ctx.fillStyle = col; ctx.strokeStyle = 'rgba(0,0,0,0.6)'; ctx.lineWidth = 2;
    if (it.kind === 'core') { ctx.save(); ctx.translate(it.x, it.y); ctx.rotate(now / 600); ctx.fillRect(-11, -11, 22, 22); ctx.restore(); }
    else if (it.kind === 'cell') { ctx.beginPath(); ctx.arc(it.x, it.y, 11, 0, 7); ctx.fill(); ctx.stroke(); }
    else if (it.kind === 'medkit') { ctx.fillRect(it.x - 10, it.y - 6, 20, 12); ctx.fillRect(it.x - 4, it.y - 12, 8, 24); }
    else { ctx.beginPath(); ctx.moveTo(it.x, it.y - 12); ctx.lineTo(it.x + 10, it.y + 8); ctx.lineTo(it.x - 10, it.y + 8); ctx.closePath(); ctx.fill(); ctx.stroke(); }
  }
  for (const p of (sv.parts || [])) {
    const ip = svView.interp.get(p.id) || p;
    const isMe = p.id === S.you;
    ctx.fillStyle = p.down ? '#5a5a5a' : isMe ? '#7ee2a8' : '#4aa3ff';
    ctx.strokeStyle = '#04120a'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(ip.x, ip.y, isMe ? 17 : 14, 0, 7); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#06130c'; ctx.font = '700 13px monospace';
    ctx.fillText(String((P(p.id).name || '?')).slice(0, 6).toUpperCase(), ip.x, ip.y + 4);
    if (p.down) { ctx.fillStyle = '#ff5a5a'; ctx.font = '700 12px monospace'; ctx.fillText('DOWN', ip.x, ip.y - 24); }
    else if ((p.carry || []).length) { ctx.fillStyle = '#ffd98a'; ctx.font = '700 11px monospace'; ctx.fillText('x' + p.carry.length, ip.x + 22, ip.y - 12); }
    if (isMe) { ctx.strokeStyle = 'rgba(126,226,168,0.9)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(ip.x, ip.y, 24, 0, 7); ctx.stroke(); }
  }
  const left = svTimeLeft();
  const clock = $('#sv-clock');
  if (clock && left !== null) { clock.textContent = left + 's'; clock.classList.toggle('hot', left <= 20); }
  if ((sv.phase === 'run' || sv.phase === 'extract') && !svDraw.t) {
    svDraw.t = setInterval(() => { if (!S || String(S.phase).indexOf('salvage-') !== 0) { clearInterval(svDraw.t); svDraw.t = null; return; } svDraw(); }, 400);
  }
  if (sv.phase !== 'run' && sv.phase !== 'extract' && svDraw.t) { clearInterval(svDraw.t); svDraw.t = null; }
}
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) {
    if (ac && ac.state === 'suspended') ac.resume();
    if (!wsConnected && ws?.readyState !== WebSocket.OPEN) connect(false);
  }
});

window.addEventListener('pagehide', () => {
  stream?.getTracks().forEach(t => t.stop());
  closeAllPeers();
});

window.addEventListener('beforeunload', () => {
  stream?.getTracks().forEach(t => t.stop());
  closeAllPeers();
  clearInterval(timerInterval);
  clearInterval(speakingInterval);
});

render();
updateVoiceUI();
connect(true);
</script></body></html>
